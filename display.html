<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan - Advan Workmate Ryzen 5 Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            transform: scale(0.85); /* Skala keseluruhan diperkecil agar pas */
            transform-origin: center center;
        }

        /* Container Utama disesuaikan agar pas di layar laptop 16:9 */
        .board-container { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
            height: 85vh;
            max-height: 650px;
            align-items: center;
            justify-content: center;
        }

        /* Kolom Kiri & Kanan (Masing-masing 4 Kotak) */
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 110px;
            height: 100%;
            justify-content: space-between;
        }

        .slot-box {
            border: 2px solid #ffffff; 
            border-radius: 10px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            flex: 1;
        }

        /* Kotak Utama Host di Tengah dengan Rasio 9:16 */
        .card-main {
            flex: 1; 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            aspect-ratio: 9 / 16;
            height: 100%;
        }

        .card-main video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .video-host-badge {
            position: absolute; 
            top: 12px; 
            left: 12px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            padding: 4px 12px; 
            background-color: #20D5EC; 
            border-radius: 99px; 
            color: #000000; 
            font-size: 11px; 
            font-weight: 700;
        }

        /* Label Nama Host di Kiri Bawah Video Utama */
        .video-username-box {
            position: absolute; 
            bottom: 14px; 
            left: 14px;
            z-index: 10; 
            display: inline-flex; 
            align-items: center;
            padding: 5px 14px; 
            background-color: rgba(20, 20, 25, 0.85); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 99px; 
            display: none; 
        }
        .video-username { 
            font-size: 12px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .request-placeholder {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 4px;
            color: #ffffff; 
            user-select: none; 
            width: 100%; 
            height: 100%;
        }
        .request-placeholder .plus-icon { 
            font-size: 26px; 
            font-weight: 700; 
            line-height: 1; 
            color: #ffffff; 
        }
        .request-placeholder .request-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 8px;
            text-align: center;
        }
        .target-display-content.show {
            display: flex;
        }
        .target-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #20D5EC;
            object-fit: cover;
            margin-bottom: 6px;
        }
        .target-name {
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .target-uname {
            font-size: 9px;
            color: #20D5EC;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        /* Banner Pop-up TikTok Gift (Diposisikan di Kiri Bawah di dalam card-main) */
        .giftPopupContainer {
            position: absolute;
            bottom: 50px; /* Diatur berada di atas label nama host / sisi kiri bawah */
            left: 14px; 
            background: linear-gradient(90deg, rgba(20,20,25,0.85) 0%, rgba(35,35,45,0.75) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px 6px 6px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateX(-120%);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            max-width: 85%;
        }
        .giftPopupContainer.show {
            transform: translateX(0);
            opacity: 1;
        }
        .popup-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            object-fit: cover;
            flex-shrink: 0;
        }
        .popup-name {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }
        .popup-gift-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .popup-count {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
            margin-left: 2px;
        }
        .popup-count.bounce {
            animation: popSpam 0.2s ease-out;
        }

        @keyframes popSpam {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <!-- Kolom Kiri (Slot 1 sampai 4) -->
        <div class="side-column">
            <div class="slot-box" id="slot-1">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-2">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-3">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-4">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
        </div>

        <!-- Bagian Tengah (Video Host Utama) -->
        <div class="card-main">
            <div class="video-host-badge"><span>Host</span></div>
            <div class="video-username-box" id="displayHostUserBox"><span class="video-username" id="displayHostUser"></span></div>
            <video id="displayHostVideo" autoplay muted loop playsinline></video>

            <!-- Pop-up Gift di Kiri Bawah -->
            <div class="giftPopupContainer" id="giftPopupContainer">
                <img class="popup-avatar" id="popupAvatar" src="" alt="Avatar">
                <span class="popup-name" id="popupName">Nama</span>
                <img class="popup-gift-img" id="popupGiftImg" src="" alt="Gift">
                <span class="popup-count" id="popupCount">x1</span>
            </div>
        </div>

        <!-- Kolom Kanan (Slot 5 sampai 8) -->
        <div class="side-column">
            <div class="slot-box" id="slot-5">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-6">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-7">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-8">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const displayHostUserBox = document.getElementById('displayHostUserBox');
        const displayHostUser = document.getElementById('displayHostUser');
        const giftPopupContainer = document.getElementById('giftPopupContainer');
        const popupAvatar = document.getElementById('popupAvatar');
        const popupName = document.getElementById('popupName');
        const popupGiftImg = document.getElementById('popupGiftImg');
        const popupCount = document.getElementById('popupCount');

        let popupTimer = null;

        channel.onmessage = (event) => {
            const { type, url, data, slot, count, giftUrl } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                displayHostVideo.src = url;
                displayHostVideo.play().catch(e => console.log("Autoplay blocked"));
            }

            if (type === 'UPDATE_HOST_USER') {
                displayHostUser.innerText = data || '';
                if (data && data.trim() !== '') {
                    displayHostUserBox.style.display = 'inline-flex';
                } else {
                    displayHostUserBox.style.display = 'none';
                }
            }

            if (type === 'TRIGGER_GIFT_POPUP') {
                const targetSlotEl = document.getElementById(`slot-${slot}`);
                if (targetSlotEl) {
                    const avatarSrc = targetSlotEl.querySelector('.target-avatar').src;
                    const nameText = targetSlotEl.querySelector('.target-name').innerText;

                    if (avatarSrc && nameText && nameText !== 'Nama') {
                        popupAvatar.src = avatarSrc;
                        popupName.innerText = nameText;
                        popupGiftImg.src = giftUrl;
                        popupCount.innerText = `x${count}`;

                        popupCount.classList.remove('bounce');
                        void popupCount.offsetWidth; 
                        popupCount.classList.add('bounce');

                        giftPopupContainer.classList.add('show');

                        clearTimeout(popupTimer);
                        popupTimer = setTimeout(() => {
                            giftPopupContainer.classList.remove('show');
                        }, 3000);
                    }
                }
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (!data || !data.slot) return;
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                const placeholder = slotEl.querySelector('.request-placeholder');
                const content = slotEl.querySelector('.target-display-content');
                const avatar = slotEl.querySelector('.target-avatar');
                const nameEl = slotEl.querySelector('.target-name');
                const unameEl = slotEl.querySelector('.target-uname');

                if (data.clear) {
                    content.classList.remove('show');
                    placeholder.style.display = 'flex';
                    return;
                }

                if (data.username) {
                    placeholder.style.display = 'none';
                    content.classList.add('show');

                    avatar.src = data.photo || '';
                    nameEl.innerText = data.name || '';
                    unameEl.innerText = data.username || '';
                }
            }
        };
    </script>
</body>
</html>
