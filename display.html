<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan - Advan Workmate Ryzen 5 Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 3vh;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            transform: scale(0.85);
            transform-origin: center top;
        }

        .board-container { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
            height: 85vh;
            max-height: 650px;
            align-items: center;
            justify-content: center;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 110px;
            height: 100%;
            justify-content: space-between;
        }

        .slot-box {
            border: 2px solid #ffffff; 
            border-radius: 10px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            flex: 1;
        }

        .card-main {
            flex: 1; 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            aspect-ratio: 9 / 16;
            height: 100%;
        }

        .card-main video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .video-host-badge {
            position: absolute; 
            top: 12px; 
            left: 12px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            padding: 4px 12px; 
            background-color: #20D5EC; 
            border-radius: 99px; 
            color: #000000; 
            font-size: 11px; 
            font-weight: 700;
        }

        .video-username-box {
            position: absolute; 
            bottom: 14px; 
            left: 14px;
            z-index: 10; 
            display: inline-flex; 
            align-items: center;
            padding: 5px 14px; 
            background-color: rgba(20, 20, 25, 0.85); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 99px; 
            display: none; 
        }
        .video-username { 
            font-size: 12px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .request-placeholder {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 4px;
            color: #ffffff; 
            user-select: none; 
            width: 100%; 
            height: 100%;
        }
        .request-placeholder .plus-icon { 
            font-size: 26px; 
            font-weight: 700; 
            line-height: 1; 
            color: #ffffff; 
        }
        .request-placeholder .request-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 8px;
            text-align: center;
        }
        .target-display-content.show {
            display: flex;
        }
        .target-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #20D5EC;
            object-fit: cover;
            margin-bottom: 6px;
        }
        .target-name {
            font-size: 10px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .target-uname {
            font-size: 9px;
            color: #20D5EC;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        /* Banner Pop-up TikTok Gift di Kiri Bawah */
        .giftPopupContainer {
            position: absolute;
            bottom: 52px; 
            left: 14px; 
            background: linear-gradient(90deg, rgba(20,20,25,0.9) 0%, rgba(35,35,45,0.8) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px 6px 6px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateX(-120%);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            max-width: 85%;
        }
        .giftPopupContainer.show {
            transform: translateX(0);
            opacity: 1;
        }
        .popup-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            object-fit: cover;
            flex-shrink: 0;
        }
        .popup-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .popup-name {
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .popup-uname {
            font-size: 9px;
            color: #fbbf24;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .popup-gift-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .popup-count {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
            margin-left: 2px;
        }
        .popup-count.bounce {
            animation: popSpam 0.2s ease-out;
        }

        @keyframes popSpam {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <!-- Kolom Kiri -->
        <div class="side-column">
            <div class="slot-box" id="slot-1">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-2">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-3">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-4">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
        </div>

        <!-- Bagian Tengah (Video Host Utama) -->
        <div class="card-main">
            <div class="video-host-badge"><span>Host</span></div>
            <div class="video-username-box" id="displayHostUserBox"><span class="video-username" id="displayHostUser"></span></div>
            <!-- Video diatur dengan volume maksimal (1.0) -->
            <video id="displayHostVideo" autoplay loop playsinline></video>

            <!-- Pop-up Gift di Kiri Bawah -->
            <div class="giftPopupContainer" id="giftPopupContainer">
                <img class="popup-avatar" id="popupAvatar" src="" alt="Avatar">
                <div class="popup-info">
                    <span class="popup-name" id="popupName">Nama</span>
                    <span class="popup-uname" id="popupUname">Mengirim Finger Heart</span>
                </div>
                <img class="popup-gift-img" id="popupGiftImg" src="" alt="Gift">
                <span class="popup-count" id="popupCount">x1</span>
            </div>
        </div>

        <!-- Kolom Kanan -->
        <div class="side-column">
            <div class="slot-box" id="slot-5">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-6">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-7">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
            <div class="slot-box" id="slot-8">
                <div class="request-placeholder"><span class="plus-icon">+</span><span class="request-text">Permintaan</span></div>
                <div class="target-display-content">
                    <img class="target-avatar" src="" alt="Avatar">
                    <div class="target-name">Nama</div>
                    <div class="target-uname">@username</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const displayHostUserBox = document.getElementById('displayHostUserBox');
        const displayHostUser = document.getElementById('displayHostUser');
        const giftPopupContainer = document.getElementById('giftPopupContainer');
        const popupAvatar = document.getElementById('popupAvatar');
        const popupName = document.getElementById('popupName');
        const popupUname = document.getElementById('popupUname');
        const popupGiftImg = document.getElementById('popupGiftImg');
        const popupCount = document.getElementById('popupCount');

        let popupTimer = null;

        const defaultCustomPhoto = "https://b.top4top.io/p_3905d2xmz1.jpeg";
        const randomNames = ["J.K 090102", "Siti Rahma", "Budi Santoso", "Dewi Lestari", "Rizky Pratama"];

        // Fungsi pemetaan deteksi akurat sesuai pilihan gift yang masuk tanpa paksaan ke satu jenis
        function getGiftActionText(count, giftName, giftUrl) {
            const numCount = Number(count);
            
            // Pencocokan presisi berdasarkan opsi angka count yang Anda berikan
            if (numCount === 5) return "Mengirim Finger Heart";
            if (numCount === 10) return "Mengirim I love you";
            if (numCount === 15) return "Mengirim Bravo!";
            if (numCount === 20) return "Mengirim Perfume";
            if (numCount === 30) return "Mengirim Doughnut";
            if (numCount === 99) return "Mengirim Hat and Mustac";

            // Deteksi berdasarkan teks nama gift atau URL jika dikirim spesifik dari panel kontrol
            const checkStr = ((giftName || "") + " " + (giftUrl || "")).toLowerCase();
            if (checkStr.includes('love') || checkStr.includes('ilu')) return "Mengirim I love you";
            if (checkStr.includes('bravo')) return "Mengirim Bravo!";
            if (checkStr.includes('perfume')) return "Mengirim Perfume";
            if (checkStr.includes('doughnut') || checkStr.includes('donut')) return "Mengirim Doughnut";
            if (checkStr.includes('hat') || checkStr.includes('mustac') || checkStr.includes('mustache')) return "Mengirim Hat and Mustac";
            if (checkStr.includes('heart') || checkStr.includes('finger')) return "Mengirim Finger Heart";

            // Jika ada nama gift kustom dari input controller, tampilkan langsung
            if (giftName && giftName.trim() !== "") {
                return `Mengirim ${giftName}`;
            }

            // Fallback dinamis berdasarkan angka count jika tidak terdaftar di atas
            return `Mengirim Gift (${numCount || 1})`;
        }

        channel.onmessage = (event) => {
            const { type, url, data, count, giftUrl, senderName, senderUname, senderPhoto, giftName } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                displayHostVideo.src = url;
                displayHostVideo.muted = false;
                displayHostVideo.volume = 1.0; // Volume maksimal 100%
                displayHostVideo.play().catch(e => {
                    console.log("Autoplay dengan suara diblokir browser, klik sekali pada halaman.");
                });
            }

            if (type === 'UPDATE_HOST_USER') {
                displayHostUser.innerText = data || '';
                if (data && data.trim() !== '') {
                    displayHostUserBox.style.display = 'inline-flex';
                } else {
                    displayHostUserBox.style.display = 'none';
                }
            }

            if (type === 'TRIGGER_GIFT_POPUP') {
                const currentHostName = displayHostUser.innerText.trim();
                const chosenName = senderName || (currentHostName !== "" ? currentHostName : randomNames[Math.floor(Math.random() * randomNames.length)]);
                
                // Mendeteksi jenis teks gift secara akurat sesuai opsi yang dipilih
                const giftActionMessage = getGiftActionText(count, giftName, giftUrl);
                
                popupAvatar.src = senderPhoto || defaultCustomPhoto;
                popupName.innerText = chosenName;
                popupUname.innerText = giftActionMessage; 
                popupGiftImg.src = giftUrl || '';
                popupCount.innerText = `x${count || 1}`;

                popupCount.classList.remove('bounce');
                void popupCount.offsetWidth; 
                popupCount.classList.add('bounce');

                giftPopupContainer.classList.add('show');

                clearTimeout(popupTimer);
                popupTimer = setTimeout(() => {
                    giftPopupContainer.classList.remove('show');
                }, 3000);
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (!data || !data.slot) return;
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                const placeholder = slotEl.querySelector('.request-placeholder');
                const content = slotEl.querySelector('.target-display-content');
                const avatar = slotEl.querySelector('.target-avatar');
                const nameEl = slotEl.querySelector('.target-name');
                const unameEl = slotEl.querySelector('.target-uname');

                if (data.clear) {
                    content.classList.remove('show');
                    placeholder.style.display = 'flex';
                    return;
                }

                if (data.username) {
                    placeholder.style.display = 'none';
                    content.classList.add('show');

                    avatar.src = data.photo || '';
                    nameEl.innerText = data.name || '';
                    unameEl.innerText = data.username || '';
                }
            }
        };

        // Mengaktifkan suara secara otomatis pada volume 100% saat interaksi pertama
        window.addEventListener('click', () => {
            if (displayHostVideo.paused && displayHostVideo.src) {
                displayHostVideo.muted = false;
                displayHostVideo.volume = 1.0;
                displayHostVideo.play().catch(e => {});
            }
        }, { once: true });
    </script>
</body>
</html>
