<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Screen - Auto Nickname Resolution (11:16)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #0f172a; font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        #displayScreen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (11 / 16));
            max-height: calc(100vw * (16 / 11));
            overflow: hidden;
            background: #0f172a;
        }
        #hostVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: fill; z-index: 1;
        }
        .layout-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 10px; box-sizing: border-box; z-index: 3; pointer-events: none;
        }
        .side-column {
            display: flex; flex-direction: column; gap: 10px; height: 100%; justify-content: center;
        }
        
        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Kotak Slot Utama */
        .slot-box {
            position: relative;
            width: 120px; height: 120px; 
            background: rgba(22, 27, 34, 0.85);
            border: 2.5px solid rgba(255, 255, 255, 0.22); 
            border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; box-shadow: 0 6px 15px rgba(0,0,0,0.7); overflow: visible;
        }
        .slot-box.filled {
            border-color: rgba(255, 255, 255, 0.35); 
            background: rgba(15, 20, 28, 0.95);
        }

        /* Bingkai Emas Foto Profil di Tengah */
        .photo-frame {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef08a, #eab308, #ca8a04);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .slot-photo {
            width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
            background-color: #334155;
        }

        /* Badge Kiri Atas */
        .top-left-badge {
            position: absolute;
            top: 6px; left: 6px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 2px 6px 2px 2px;
            display: flex; align-items: center; gap: 4px;
            z-index: 25;
            display: none;
        }
        .blue-star-circle {
            width: 18px; height: 18px;
            background: #0ea5e9;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .blue-star-circle svg { width: 11px; height: 11px; fill: #ffffff; }
        .top-left-badge span { color: #ffffff; font-size: 9.5px; font-weight: bold; }

        /* Icon Gift Kanan Atas */
        .top-badge-icon {
            position: absolute;
            top: -10px; right: -10px;
            width: 34px; height: 34px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9));
            z-index: 30;
            display: none;
        }

        /* Control Bar Bawah */
        .bottom-control-bar {
            position: absolute;
            bottom: 6px; left: 6px; right: 6px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 3px 6px;
            z-index: 20;
        }
        
        /* Sisi Kiri Bawah: Nama Akun (Nickname) & Icon Plus */
        .bottom-left-area {
            display: flex; align-items: center; gap: 3px;
            max-width: 74px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 4px;
            border-radius: 10px;
            overflow: hidden;
        }
        .slot-nickname {
            color: #ffffff;
            font-size: 8.5px;
            font-weight: bold;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; /* Otomatis jadi ... jika panjang seperti Jirun... */
            display: block;
        }
        .mini-icon-plus {
            width: 14px; height: 14px; background: rgba(255, 255, 255, 0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .mini-icon-plus svg { width: 8px; height: 8px; fill: white; }

        /* Sisi Kanan Bawah: Mikrofon Bulat */
        .bottom-right-mic-wrapper {
            width: 22px; height: 22px; 
            background: rgba(40, 45, 55, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .bottom-right-mic-wrapper svg { width: 11px; height: 11px; fill: #94a3b8; }

        .default-plus { font-size: 28px; color: #777; font-weight: bold; }
        .default-text { font-size: 9.5px; color: #777; margin-top: 2px; text-align: center; }

        #giftOverlayContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; display: flex; justify-content: center; align-items: center;
            pointer-events: none; overflow: hidden;
        }
        #giftCanvas { width: 100%; height: 100%; object-fit: fill; display: none; }
        #giftVideoSource { display: none; }
    </style>
</head>
<body>

    <div id="displayScreen">
        <video id="hostVideo" autoplay loop playsinline></video>
        
        <div class="layout-container">
            <div class="side-column" id="left-column"></div>
            <div class="side-column" id="right-column"></div>
        </div>

        <div id="giftOverlayContainer">
            <video id="giftVideoSource" crossorigin="anonymous" playsinline></video>
            <canvas id="giftCanvas"></canvas>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const leftColumn = document.getElementById('left-column');
        const rightColumn = document.getElementById('right-column');
        const displayScreen = document.getElementById('displayScreen');
        const slotsState = {};

        const totalSlots = 8;
        const middleSlot = 4;

        function formatNumber(num) {
            if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace('.', ',') + 'M';
            if (num >= 1_000) return (num / 1_000).toFixed(1).replace('.', ',') + 'K';
            return num.toString();
        }

        // Fungsi pintar untuk mendeteksi dan membersihkan input dari Username / Link Profil TikTok
        function parseTargetInput(input) {
            if (!input) return { username: '', cleanName: '' };
            let clean = input.trim();
            
            // Jika berupa link profil (misal: https://www.tiktok.com/@namatarget atau tiktok.com/@namatarget)
            if (clean.includes('tiktok.com/')) {
                const parts = clean.split('[@/]');
                // Ambil bagian setelah '@'
                const match = clean.match(/@([a-zA-Z0-9_.−]+)/);
                if (match) {
                    clean = '@' + match[1];
                }
            }

            // Hilangkan karakter '@' di depan untuk dijadikan basis nama jika belum ada nickname khusus
            let baseName = clean.startsWith('@') ? clean.substring(1) : clean;
            
            // Format kapitalisasi rapi (ubah huruf awal jadi kapital atau pertahankan)
            return {
                username: clean,
                cleanName: baseName
            };
        }

        for (let i = 1; i <= totalSlots; i++) {
            slotsState[i] = { nickname: '', username: '', photo: '', topIcon: '', counter: 0 };
            
            const wrapper = document.createElement('div');
            wrapper.className = 'slot-wrapper';

            const box = document.createElement('div');
            box.className = 'slot-box'; 
            box.id = `display_slot_${i}`;
            box.innerHTML = `
                <div class="top-left-badge" id="left_badge_${i}">
                    <div class="blue-star-circle">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </div>
                    <span id="counter_text_${i}">0,0K</span>
                </div>
                <img class="top-badge-icon" id="icon_badge_${i}" crossorigin="anonymous" style="display: none;">
                <div class="default-plus">+</div>
                <div class="default-text">Permintaan</div>
            `;

            wrapper.appendChild(box);
            if (i <= middleSlot) leftColumn.appendChild(wrapper); else rightColumn.appendChild(wrapper);
        }

        const hostVideo = document.getElementById('hostVideo');
        const giftVideo = document.getElementById('giftVideoSource');
        const giftCanvas = document.getElementById('giftCanvas');
        const ctx = giftCanvas.getContext('2d', { willReadFrequently: true });
        let renderInterval = null;
        let iconTimeouts = {};
        let counterIntervals = {};
        let badgeTimeouts = {};

        channel.onmessage = function (event) {
            const data = event.data;

            if (data.type === 'UPDATE_HOST_VIDEO') {
                hostVideo.src = data.url;
                hostVideo.load();
                hostVideo.play().catch(err => console.log(err));
            }

            if (data.type === 'TRIGGER_GIFT') {
                giftVideo.src = data.url;
                giftVideo.load();
                giftVideo.currentTime = 0;
                
                if (data.slots) {
                    for (let i = 1; i <= totalSlots; i++) {
                        if (data.slots[i]) {
                            if (data.slots[i].topIcon) {
                                slotsState[i].topIcon = data.slots[i].topIcon;
                                const iconEl = document.getElementById(`icon_badge_${i}`);
                                if (iconEl) {
                                    iconEl.src = slotsState[i].topIcon;
                                    iconEl.style.display = 'block';
                                    if (iconTimeouts[i]) clearTimeout(iconTimeouts[i]);
                                    iconTimeouts[i] = setTimeout(() => {
                                        iconEl.style.display = 'none';
                                        slotsState[i].topIcon = '';
                                    }, 3000);
                                }
                            }

                            if (slotsState[i].photo) {
                                let currentVal = slotsState[i].counter || 0;
                                const counterText = document.getElementById(`counter_text_${i}`);
                                if (counterIntervals[i]) clearInterval(counterIntervals[i]);
                                
                                counterIntervals[i] = setInterval(() => {
                                    currentVal += Math.floor(Math.random() * 3000) + 1200;
                                    slotsState[i].counter = currentVal;
                                    if(counterText) counterText.innerText = formatNumber(currentVal);
                                }, 150);

                                if (badgeTimeouts[i]) clearTimeout(badgeTimeouts[i]);
                                badgeTimeouts[i] = setTimeout(() => {
                                    clearInterval(counterIntervals[i]);
                                }, 3500);
                            }
                        }
                    }
                }

                giftVideo.play().then(() => {
                    giftCanvas.style.display = 'block';
                    giftCanvas.width = displayScreen.clientWidth;
                    giftCanvas.height = displayScreen.clientHeight;
                    
                    if (renderInterval) clearInterval(renderInterval);
                    renderInterval = setInterval(() => {
                        if (giftVideo.paused || giftVideo.ended) {
                            clearInterval(renderInterval);
                            giftCanvas.style.display = 'none';
                            return;
                        }
                        ctx.drawImage(giftVideo, 0, 0, giftCanvas.width, giftCanvas.height);
                        let frame = ctx.getImageData(0, 0, giftCanvas.width, giftCanvas.height);
                        let l = frame.data.length;
                        
                        for (let p = 0; p < l; p += 4) {
                            let red = frame.data[p];
                            let green = frame.data[p + 1];
                            let blue = frame.data[p + 2];
                            
                            if (green > 95 && red < 90 && blue < 90) {
                                frame.data[p + 3] = 0;
                            }
                        }
                        ctx.putImageData(frame, 0, 0);
                    }, 30);
                }).catch(err => console.log(err));
            }

            if (data.type === 'UPDATE_SLOT') {
                // Pemrosesan sistem kontrol input username / link profil
                let rawInput = data.data.username || data.data.nickname || '';
                let parsed = parseTargetInput(rawInput);

                slotsState[data.slot] = { 
                    ...slotsState[data.slot], 
                    ...data.data,
                    username: parsed.username,
                    // Sistem kontrol otomatis memetakan nama akun yang bersih dari hasil parsing link/username
                    nickname: data.data.nickname ? data.data.nickname : parsed.cleanName 
                };

                const box = document.getElementById(`display_slot_${data.slot}`);
                const slot = slotsState[data.slot];
                const iconEl = document.getElementById(`icon_badge_${data.slot}`);
                const leftBadge = document.getElementById(`left_badge_${data.slot}`);

                iconEl.style.display = 'none';

                if (slot.photo) {
                    box.classList.add('filled');
                    leftBadge.style.display = 'flex';

                    box.innerHTML = ``;
                    box.appendChild(leftBadge);
                    box.appendChild(iconEl);

                    // Bingkai Foto Profil Emas
                    const photoFrame = document.createElement('div');
                    photoFrame.className = 'photo-frame';
                    const photoImg = document.createElement('img');
                    photoImg.src = slot.photo;
                    photoImg.className = 'slot-photo';
                    photoImg.crossOrigin = 'anonymous';
                    photoFrame.appendChild(photoImg);
                    box.appendChild(photoFrame);

                    // Nama Akun (Nickname) yang akan tampil di kotak (jika panjang otomatis terpotong jadi ...)
                    const displayName = slot.nickname || slot.username || 'User';

                    const controlBar = document.createElement('div');
                    controlBar.className = 'bottom-control-bar';
                    controlBar.innerHTML = `
                        <div class="bottom-left-area">
                            <span class="slot-nickname" title="${displayName}">${displayName}</span>
                            <div class="mini-icon-plus"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
                        </div>
                        <div class="bottom-right-mic-wrapper">
                            <svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.03.02-.06.02-.09V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.98zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.3 .52-2.76 0-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c1.02-.15 1.98-.51 2.84-1.03L19.73 21 21 19.73 4.27 3z"/></svg>
                        </div>
                    `;
                    box.appendChild(controlBar);
                } else {
                    box.classList.remove('filled');
                    leftBadge.style.display = 'none';

                    box.innerHTML = ``;
                    box.appendChild(leftBadge);
                    box.appendChild(iconEl);

                    const plusDiv = document.createElement('div');
                    plusDiv.className = 'default-plus';
                    plusDiv.innerText = '+';
                    const textDiv = document.createElement('div');
                    textDiv.className = 'default-text';
                    textDiv.innerText = 'Permintaan';
                    
                    box.appendChild(plusDiv);
                    box.appendChild(textDiv);
                }
            }
        };

        document.body.addEventListener('click', () => {
            if (hostVideo.paused && hostVideo.src) {
                hostVideo.play().catch(e => console.log(e));
            }
        });
    </script>
</body>
</html>
