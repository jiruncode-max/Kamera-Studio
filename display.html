<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan - Advan Workmate Ryzen 5 Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 3vh;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            transform: scale(0.85);
            transform-origin: center top;
        }

        .board-container { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
            height: 85vh;
            max-height: 650px;
            align-items: center;
            justify-content: center;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 130px;
            height: 100%;
            justify-content: space-between;
        }

        .slot-box {
            border: 2px solid #ffffff; 
            border-radius: 10px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            flex: 1;
        }

        /* State ketika slot terisi target: sedikit abu-abu & garis-garis kotak putih (dashed) */
        .slot-box.filled {
            background-color: rgba(50, 50, 50, 0.4);
            border: 2px dashed #ffffff;
        }

        .card-main {
            flex: 1; 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            aspect-ratio: 9 / 16;
            height: 100%;
        }

        .card-main video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .video-host-badge {
            position: absolute; 
            top: 12px; 
            left: 12px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            padding: 4px 12px; 
            background-color: #20D5EC; 
            border-radius: 99px; 
            color: #000000; 
            font-size: 11px; 
            font-weight: 700;
        }

        .video-username-box {
            position: absolute; 
            bottom: 14px; 
            left: 14px;
            z-index: 10; 
            display: inline-flex; 
            align-items: center;
            padding: 5px 14px; 
            background-color: rgba(20, 20, 25, 0.85); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 99px; 
            display: none; 
        }
        .video-username { 
            font-size: 12px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .request-placeholder {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 4px;
            color: #ffffff; 
            user-select: none; 
            width: 100%; 
            height: 100%;
        }
        .request-placeholder .plus-icon { 
            font-size: 26px; 
            font-weight: 700; 
            line-height: 1; 
            color: #ffffff; 
        }
        .request-placeholder .request-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 6px;
            text-align: center;
        }
        .target-display-content.show {
            display: flex;
        }

        /* Icon Bintang & Angka Poin di Kiri Atas */
        .slot-score-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
        }
        .star-circle {
            width: 16px;
            height: 16px;
            background-color: #20D5EC;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #ffffff;
        }
        .slot-score-text {
            font-size: 10px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Icon Gift yang muncul di Atas Kotak Bagian Kanan (Durasi 3 Detik) */
        .slot-gift-floating {
            position: absolute;
            top: 6px;
            right: 6px;
            display: none;
            align-items: center;
            gap: 2px;
            background: rgba(251, 191, 36, 0.9);
            padding: 2px 5px;
            border-radius: 10px;
            z-index: 10;
            animation: fadeInOut 3s forwards;
        }
        .slot-gift-floating img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        .slot-gift-floating span {
            font-size: 9px;
            font-weight: 900;
            color: #000;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); display: none; }
        }

        .target-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #20D5EC;
            object-fit: cover;
            margin-bottom: 2px;
        }

        /* Bagian Nama TikTok & Icon + di Kiri Bawah & Mikrofon Mute di Kanan Bawah */
        .target-footer-info {
            position: absolute;
            bottom: 4px;
            left: 6px;
            right: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .target-uname-container {
            display: flex;
            align-items: center;
            gap: 3px;
            overflow: hidden;
            max-width: 75%;
        }
        .target-uname {
            font-size: 9px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .add-user-icon {
            font-size: 11px;
            font-weight: 900;
            color: #20D5EC;
            background: rgba(32, 213, 236, 0.2);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Icon Mikrofon di Mute (\) di Kanan Bawah */
        .mic-mute-icon {
            font-size: 10px;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.2);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Banner Pop-up Gift Global di Kiri Bawah Card Main */
        .giftPopupContainer {
            position: absolute;
            bottom: 52px; 
            left: 14px; 
            background: linear-gradient(90deg, rgba(20,20,25,0.9) 0%, rgba(35,35,45,0.8) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px 6px 6px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateX(-120%);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            max-width: 85%;
        }
        .giftPopupContainer.show {
            transform: translateX(0);
            opacity: 1;
        }
        .popup-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            object-fit: cover;
            flex-shrink: 0;
        }
        .popup-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .popup-name {
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .popup-uname {
            font-size: 9px;
            color: #fbbf24;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .popup-gift-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .popup-count {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
            margin-left: 2px;
        }
        .popup-count.bounce {
            animation: popSpam 0.2s ease-out;
        }

        @keyframes popSpam {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
    </style>
</head>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const displayHostUserBox = document.getElementById('displayHostUserBox');
        const displayHostUser = document.getElementById('displayHostUser');
        const giftPopupContainer = document.getElementById('giftPopupContainer');
        const popupAvatar = document.getElementById('popupAvatar');
        const popupName = document.getElementById('popupName');
        const popupUname = document.getElementById('popupUname');
        const popupGiftImg = document.getElementById('popupGiftImg');
        const popupCount = document.getElementById('popupCount');

        let popupTimer = null;
        const slotScores = {}; // Menyimpan skor/poin tiap slot

        const defaultCustomPhoto = "https://b.top4top.io/p_3905d2xmz1.jpeg";
        const randomNames = ["J.K 090102", "Siti Rahma", "Budi Santoso", "Dewi Lestari", "Rizky Pratama"];

        function getGiftActionText(targetSlot) {
            const numSlot = Number(targetSlot);
            if (!isNaN(numSlot) && numSlot >= 1 && numSlot <= 8) {
                return `Mengirim Kotak ${numSlot}`;
            }
            return "Mengirim Kotak 1";
        }

        channel.onmessage = (event) => {
            const { type, url, data, count, giftUrl, senderName, senderPhoto, slot } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                displayHostVideo.src = url;
                displayHostVideo.muted = false;
                displayHostVideo.play().catch(e => {
                    console.log("Autoplay dengan suara diblokir browser, klik sekali pada halaman.");
                });
            }

            if (type === 'UPDATE_HOST_USER') {
                displayHostUser.innerText = data || '';
                if (data && data.trim() !== '') {
                    displayHostUserBox.style.display = 'inline-flex';
                } else {
                    displayHostUserBox.style.display = 'none';
                }
            }

            if (type === 'TRIGGER_GIFT_POPUP') {
                const currentHostName = displayHostUser.innerText.trim();
                const chosenName = senderName || (currentHostName !== "" ? currentHostName : randomNames[Math.floor(Math.random() * randomNames.length)]);
                
                const targetSlot = slot || 1;
                const giftActionMessage = getGiftActionText(targetSlot);
                const giftCount = Number(count) || 1;

                // Update Skor pada Slot yang dituju (akumulasi poin)
                if (!slotScores[targetSlot]) slotScores[targetSlot] = 0;
                slotScores[targetSlot] += giftCount;

                const slotEl = document.getElementById(`slot-${targetSlot}`);
                if (slotEl) {
                    const scoreTextEl = slotEl.querySelector('.slot-score-text');
                    if (scoreTextEl) scoreTextEl.innerText = slotScores[targetSlot];

                    // Tampilkan icon gift mengapung di kanan atas slot selama 3 detik
                    const floatGiftEl = document.getElementById(`gift-float-${targetSlot}`);
                    if (floatGiftEl) {
                        const imgTag = floatGiftEl.querySelector('img');
                        const countTag = floatGiftEl.querySelector('.float-count');
                        if (imgTag) imgTag.src = giftUrl || '';
                        if (countTag) countTag.innerText = `x${giftCount}`;

                        floatGiftEl.style.animation = 'none';
                        void floatGiftEl.offsetWidth; // Trigger reflow
                        floatGiftEl.style.display = 'flex';
                        floatGiftEl.style.animation = 'fadeInOut 3s forwards';
                    }
                }
                
                popupAvatar.src = senderPhoto || defaultCustomPhoto;
                popupName.innerText = chosenName;
                popupUname.innerText = giftActionMessage; 
                popupGiftImg.src = giftUrl || '';
                popupCount.innerText = `x${giftCount}`;

                popupCount.classList.remove('bounce');
                void popupCount.offsetWidth; 
                popupCount.classList.add('bounce');

                giftPopupContainer.classList.add('show');

                clearTimeout(popupTimer);
                popupTimer = setTimeout(() => {
                    giftPopupContainer.classList.remove('show');
                }, 3000);
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (!data || !data.slot) return;
                const slotNum = data.slot;
                const slotEl = document.getElementById(`slot-${slotNum}`);
                if (!slotEl) return;

                const placeholder = slotEl.querySelector('.request-placeholder');
                const content = slotEl.querySelector('.target-display-content');
                const avatar = slotEl.querySelector('.target-avatar');
                const unameEl = slotEl.querySelector('.target-uname');
                const scoreTextEl = slotEl.querySelector('.slot-score-text');

                if (data.clear) {
                    slotEl.classList.remove('filled');
                    content.classList.remove('show');
                    placeholder.style.display = 'flex';
                    slotScores[slotNum] = 0;
                    if (scoreTextEl) scoreTextEl.innerText = '0';
                    return;
                }

                if (data.username) {
                    placeholder.style.display = 'none';
                    slotEl.classList.add('filled');
                    content.classList.add('show');

                    avatar.src = data.photo || '';
                    unameEl.innerText = data.username || '';
                    
                    if (!slotScores[slotNum]) {
                        slotScores[slotNum] = 0;
                        if (scoreTextEl) scoreTextEl.innerText = '0';
                    }
                }
            }
        };

        window.addEventListener('click', () => {
            if (displayHostVideo.paused && displayHostVideo.src) {
                displayHostVideo.muted = false;
                displayHostVideo.play().catch(e => {});
            }
        }, { once: true });
    </script>
