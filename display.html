<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display - Live TikTok</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background: #000; font-family: Arial, sans-serif;
        }
        /* Background Host Video */
        #hostVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }
        /* Fullscreen Gift Video Overlay */
        #giftVideoContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: none; background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
        }
        #giftVideo {
            width: 100%; height: 100%; object-fit: contain;
        }
        /* Overlay UI untuk Slot Target */
        .overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: grid;
            grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 20px; padding: 30px;
        }
        .slot-display {
            background: rgba(15, 23, 42, 0.75); border: 2px solid #475569;
            border-radius: 12px; padding: 15px; display: flex; flex-direction: column;
            justify-content: space-between; position: relative; backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .slot-top-icon {
            position: absolute; top: -20px; right: 15px; width: 45px; height: 45px;
            object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .slot-header { display: flex; align-items: center; gap: 12px; }
        .slot-avatar {
            width: 50px; height: 50px; border-radius: 50%; object-fit: cover;
            border: 2px solid #38bdf8;
        }
        .slot-info { min-width: 0; flex: 1; }
        .slot-name { font-size: 15px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-username { font-size: 12px; color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .slot-footer {
            margin-top: 10px; background: rgba(0,0,0,0.4); padding: 8px 12px;
            border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
        }
        .slot-points-label { font-size: 11px; color: #94a3b8; }
        .slot-points-value { font-size: 16px; font-weight: bold; color: #facc15; }
    </style>
</head>
<body>

    <!-- Video Latar Belakang Host -->
    <video id="hostVideo" autoplay muted loop playsinline></video>

    <!-- Grid 8 Kotak Target di Layar -->
    <div class="overlay-ui" id="slotsGrid"></div>

    <!-- Container Pemutar Video Gift Fullscreen -->
    <div id="giftVideoContainer">
        <video id="giftVideo" playsinline></video>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const slotsGrid = document.getElementById('slotsGrid');
        const hostVideo = document.getElementById('hostVideo');
        const giftVideoContainer = document.getElementById('giftVideoContainer');
        const giftVideo = document.getElementById('giftVideo');

        // Menyimpan data akumulasi poin setiap slot (1-8)
        const slotPointsCache = {};

        // Inisialisasi 8 Slot Kosong di Layar Display
        for (let i = 1; i <= 8; i++) {
            slotPointsCache[i] = 0;
            const card = document.createElement('div');
            card.className = 'slot-display';
            card.id = `display_slot_${i}`;
            card.style.opacity = '0.4'; // Transparan jika belum diisi target
            
            card.innerHTML = `
                <img id="display_icon_${i}" class="slot-top-icon" src="" style="display: none;" alt="Icon">
                <div class="slot-header">
                    <img id="display_photo_${i}" class="slot-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="Avatar">
                    <div class="slot-info">
                        <div id="display_name_${i}" class="slot-name">Target ${i} Kosong</div>
                        <div id="display_username_${i}" class="slot-username">@menunggu</div>
                    </div>
                </div>
                <div class="slot-footer">
                    <span class="slot-points-label">Total Poin:</span>
                    <span id="display_points_${i}" class="slot-points-value">0</span>
                </div>
            `;
            slotsGrid.appendChild(card);
        }

        // Menerima Pesan dari Control Panel
        channel.onmessage = function (event) {
            const msg = event.data;

            if (msg.type === 'UPDATE_HOST_VIDEO') {
                hostVideo.src = msg.url;
                hostVideo.play().catch(e => console.log("Autoplay dicegah browser:", e));
            }

            if (msg.type === 'UPDATE_SLOT') {
                const i = msg.slot;
                const data = msg.data;
                const card = document.getElementById(`display_slot_${i}`);
                const photoEl = document.getElementById(`display_photo_${i}`);
                const nameEl = document.getElementById(`display_name_${i}`);
                const usernameEl = document.getElementById(`display_username_${i}`);
                const iconEl = document.getElementById(`display_icon_${i}`);

                if (data.username) {
                    card.style.opacity = '1';
                    photoEl.src = data.photo;
                    nameEl.innerText = data.name;
                    usernameEl.innerText = data.username;
                    
                    if (data.topIcon) {
                        iconEl.src = data.topIcon;
                        iconEl.style.display = 'block';
                    } else {
                        iconEl.style.display = 'none';
                    }
                } else {
                    card.style.opacity = '0.4';
                    photoEl.src = "https://api.dicebear.com/7.x/avataaars/svg?seed=default";
                    nameEl.innerText = `Target ${i} Kosong`;
                    usernameEl.innerText = "@menunggu";
                    iconEl.style.display = 'none';
                    slotPointsCache[i] = 0;
                    document.getElementById(`display_points_${i}`).innerText = '0';
                }
            }

            if (msg.type === 'TRIGGER_GIFT') {
                // Perbarui ikon & akumulasikan poin saat gift diputar
                const slotsData = msg.slots;
                for (let i = 1; i <= 8; i++) {
                    if (slotsData[i]) {
                        const iconEl = document.getElementById(`display_icon_${i}`);
                        
                        if (slotsData[i].topIcon) {
                            iconEl.src = slotsData[i].topIcon;
                            iconEl.style.display = 'block';
                        }

                        // Tambahkan poin berdasarkan pilihan gift di control panel
                        if (slotsData[i].points) {
                            slotPointsCache[i] += slotsData[i].points;
                            document.getElementById(`display_points_${i}`).innerText = slotPointsCache[i].toLocaleString('id-ID');
                        }
                    }
                }

                // Putar video animasi gift secara fullscreen
                giftVideo.src = msg.url;
                giftVideoContainer.style.display = 'flex';
                giftVideo.play().catch(e => console.log("Gagal memutar video gift:", e));
            }
        };

        // Sembunyikan video gift otomatis setelah selesai diputar
        giftVideo.onended = function () {
            giftVideoContainer.style.display = 'none';
            giftVideo.src = '';
        };
    </script>
</body>
</html>
