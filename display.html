<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Display Studio (9:16)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
        }

        /* Wrapper utama berasio 9:16 yang responsif di tengah layar */
        .wrapper-9-16 {
            width: 405px;
            height: 720px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            padding-top: 15px;
            border: 1px solid #222;
        }

        .main-container {
            display: flex; justify-content: center; align-items: flex-start;
            gap: 12px; width: 100%;
        }

        .side-column { display: flex; flex-direction: column; gap: 6px; }

        /* Kotak Sisi Kiri & Kanan */
        .box {
            width: 100px; height: 68px;
            border: 2px solid #ffffff; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000000; position: relative; overflow: hidden;
        }
        .box .plus { font-size: 18px; font-weight: bold; }
        .box .label { font-size: 9px; margin-top: 2px; }

        /* Kotak Host di Tengah */
        .host-box {
            width: 220px; height: 299px;
            border: 2px solid #ffffff; border-radius: 10px;
            position: relative; background-color: #000000; overflow: hidden;
        }
        .host-badge {
            position: absolute; top: 6px; left: 6px; z-index: 10;
            background-color: #00d2ff; color: #000; font-size: 9px;
            padding: 2px 6px; border-radius: 8px; font-weight: bold;
        }

        /* Area Background Video Host */
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; display: none;
        }

        /* Area Green Screen di Bawah */
        .green-screen-container {
            width: 536px; 
            height: 220px;
            background-color: #000000;
            position: relative; 
            margin-top: 8px;
            border-radius: 0 0 12px 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Canvas dibuat tajam tanpa pecah */
        #gsCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        /* Tampilan Slot Aktif (Avatar & Nama) */
        .slot-content {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; background: #000;
        }
        .slot-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; margin-bottom: 3px; border: 1px solid #fff; }
        .slot-name { font-size: 9px; font-weight: bold; text-align: center; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="wrapper-9-16">
        <div class="main-container">
            <!-- Kolom Kiri: Kotak 1 s.d 4 -->
            <div class="side-column">
                <div class="box" id="slot-1"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-2"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-3"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-4"><span class="plus">+</span><span class="label">Permintaan</span></div>
            </div>

            <!-- Kotak Host Tengah -->
            <div class="host-box" id="hostBox">
                <div class="host-badge" id="hostBadgeText">Host</div>
                <video class="video-bg" id="hostVideo" autoplay loop muted></video>
            </div>

            <!-- Kolom Kanan: Kotak 5 s.d 8 -->
            <div class="side-column">
                <div class="box" id="slot-5"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-6"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-7"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-8"><span class="plus">+</span><span class="label">Permintaan</span></div>
            </div>
        </div>

        <!-- Bagian Bawah: Video Green Screen Transparan -->
        <div class="green-screen-container" id="gsContainer">
            <!-- Atribut 'loop' dihapus agar video berhenti saat selesai -->
            <video id="gsVideo" src="" muted style="display:none;"></video>
            <canvas id="gsCanvas"></canvas>
            <span id="gsPlaceholder" style="color: #555; font-size: 11px; z-index: 2; position: absolute;">Area Animasi Melayang</span>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const video = document.getElementById('gsVideo');
        const canvas = document.getElementById('gsCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('gsPlaceholder');

        // Saat video dimuat ukurannya, sesuaikan resolusi canvas agar tidak pecah
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        video.addEventListener('play', () => {
            canvas.style.display = 'block';
            placeholder.style.display = 'none';

            function processFrame() {
                // Jika video sudah selesai / berhenti, hentikan proses render dan sembunyikan canvas
                if (video.paused || video.ended) {
                    canvas.style.display = 'none';
                    placeholder.style.display = 'block';
                    return;
                }
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = frame.data;

                // Algoritma Chroma Key (Pembersihan warna hijau agar rapi)
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    if (g > 70 && g > r * 1.15 && g > b * 1.15) {
                        data[i + 3] = 0; // Transparan total
                    } else if (g > r && g > b) {
                        let diff = g - Math.max(r, b);
                        if (diff > 20) {
                            data[i + 3] = Math.max(0, 255 - (diff * 6));
                        }
                    }
                }
                
                ctx.putImageData(frame, 0, 0);
                requestAnimationFrame(processFrame);
            }
            requestAnimationFrame(processFrame);
        });

        // Event listener saat video selesai diputar (berhenti otomatis)
        video.addEventListener('ended', () => {
            canvas.style.display = 'none';
            placeholder.style.display = 'block';
        });

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_USER') {
                const badge = document.getElementById('hostBadgeText');
                badge.innerText = data ? data : 'Host';
            }

            if (type === 'UPDATE_HOST_VIDEO') {
                const videoEl = document.getElementById('hostVideo');
                videoEl.src = url;
                videoEl.style.display = 'block';
                videoEl.play().catch(e => console.log(e));
            }

            if (type === 'UPDATE_GS_VIDEO') {
                video.pause();
                video.currentTime = 0;
                video.src = url;
                video.load();
                video.play().catch(e => console.log(e));
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                if (data.clear) {
                    slotEl.innerHTML = `<span class="plus">+</span><span class="label">Permintaan</span>`;
                } else {
                    slotEl.innerHTML = `
                        <div class="slot-content">
                            <img src="${data.photo}" class="slot-avatar" alt="Avatar">
                            <span class="slot-name">${data.name}</span>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
