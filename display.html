<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan (Display)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            padding: 12px 15px; /* Memberikan jarak aman agar tidak terlalu mentok ke atas */
            overflow-x: hidden;
            position: relative;
        }

        .board-container { 
            display: flex; 
            flex-direction: row; 
            gap: 20px; 
            width: 100%; 
            max-width: 950px; 
            align-items: flex-start;
            justify-content: center;
        }

        .card-main, .card-small {
            flex: 1; 
            border: 2px solid #374151; 
            border-radius: 14px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            aspect-ratio: 1 / 1; 
            /* Memperbesar tinggi kotak agar merayap naik ke atas secara maksimal */
            width: 100%;
            max-height: calc(100vh - 220px); 
        }

        .card-main video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .video-host-badge {
            position: absolute; 
            top: 12px; 
            left: 12px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            padding: 4px 12px; 
            background-color: #20D5EC; 
            border-radius: 99px; 
            color: #000000; 
            font-size: 11px; 
            font-weight: 700;
        }

        .video-username-box {
            position: absolute; 
            bottom: 12px; 
            left: 12px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center;
            padding: 4px 12px; 
            background-color: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 99px; 
            display: none; 
        }
        .video-username { 
            font-size: 12px; 
            font-weight: 700; 
            color: #ffffff; 
            line-height: normal;
        }

        .request-placeholder {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            color: #ffffff; 
            user-select: none; 
            width: 100%; 
            height: 100%;
        }
        .request-placeholder .plus-icon { 
            font-size: 42px; 
            font-weight: 700; 
            line-height: 1; 
            color: #ffffff; 
        }
        .request-placeholder .request-text { 
            font-size: 15px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 15px;
            text-align: center;
        }
        .target-display-content.show {
            display: flex;
        }
        .target-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid #20D5EC;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .target-icon-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .target-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .target-uname {
            font-size: 12px;
            color: #20D5EC;
            margin-bottom: 8px;
        }
        .target-points {
            font-size: 12px;
            font-weight: 700;
            color: #fbbf24;
            background: rgba(0,0,0,0.6);
            padding: 3px 12px;
            border-radius: 99px;
        }

        /* Area Canvas Animasi Gift di Bawah Kotak */
        .gift-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        #giftCanvasLayer {
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 16 / 9;
            display: none;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="board-container">
        <!-- Kotak Video Host (Kiri) -->
        <div class="card-main">
            <div class="video-host-badge"><span>Host</span></div>
            <div class="video-username-box" id="displayHostUserBox"><span class="video-username" id="displayHostUser"></span></div>
            <video id="displayHostVideo" autoplay muted loop playsinline></video>
        </div>

        <!-- Kotak Permintaan / Target (Kanan) -->
        <div class="card-small">
            <div class="request-placeholder" id="requestPlaceholder">
                <span class="plus-icon">+</span>
                <span class="request-text">Permintaan</span>
            </div>

            <div class="target-display-content" id="targetDisplayContent">
                <img id="targetDisplayIcon" class="target-icon-overlay" src="" style="display: none;" alt="Icon">
                <img id="targetDisplayAvatar" class="target-avatar" src="" alt="Avatar">
                <div id="targetDisplayName" class="target-name">Nama Target</div>
                <div id="targetDisplayUsername" class="target-uname">@username</div>
                <div id="targetDisplayPoints" class="target-points" style="display: none;">0</div>
            </div>
        </div>
    </div>

    <!-- Area Video Gift di Bawah Kotak -->
    <div class="gift-container">
        <video id="sourceGiftVideo" style="display:none;" playsinline></video>
        <canvas id="giftCanvasLayer"></canvas>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const displayHostUserBox = document.getElementById('displayHostUserBox');
        const displayHostUser = document.getElementById('displayHostUser');
        const requestPlaceholder = document.getElementById('requestPlaceholder');
        const targetDisplayContent = document.getElementById('targetDisplayContent');
        const targetDisplayAvatar = document.getElementById('targetDisplayAvatar');
        const targetDisplayIcon = document.getElementById('targetDisplayIcon');
        const targetDisplayName = document.getElementById('targetDisplayName');
        const targetDisplayUsername = document.getElementById('targetDisplayUsername');
        const targetDisplayPoints = document.getElementById('targetDisplayPoints');

        const sourceGiftVideo = document.getElementById('sourceGiftVideo');
        const giftCanvasLayer = document.getElementById('giftCanvasLayer');
        const ctx = giftCanvasLayer.getContext('2d');
        let animationId = null;

        channel.onmessage = (event) => {
            const { type, url, data } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                displayHostVideo.src = url;
                displayHostVideo.play().catch(e => console.log("Autoplay blocked"));
            }

            if (type === 'UPDATE_HOST_USER') {
                if (data && data.trim() !== '') {
                    displayHostUser.innerText = data;
                    displayHostUserBox.style.display = 'inline-flex';
                } else {
                    displayHostUserBox.style.display = 'none';
                }
            }

            if (type === 'PLAY_GIFT_LAYER') {
                if (url) {
                    sourceGiftVideo.src = url;
                    giftCanvasLayer.style.display = 'block';
                    sourceGiftVideo.play().then(() => {
                        runGreenScreenEffect();
                    }).catch(e => console.log("Autoplay blocked"));

                    sourceGiftVideo.onended = () => {
                        cancelAnimationFrame(animationId);
                        giftCanvasLayer.style.display = 'none';
                        ctx.clearRect(0, 0, giftCanvasLayer.width, giftCanvasLayer.height);
                        sourceGiftVideo.src = '';
                    };
                }
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (data && data.username) {
                    requestPlaceholder.style.display = 'none';
                    targetDisplayContent.classList.add('show');

                    targetDisplayAvatar.src = data.photo || '';
                    targetDisplayName.innerText = data.name || '';
                    targetDisplayUsername.innerText = data.username || '';

                    if (data.topIcon) {
                        targetDisplayIcon.src = data.topIcon;
                        targetDisplayIcon.style.display = 'block';
                    } else {
                        targetDisplayIcon.style.display = 'none';
                    }

                    if (data.points && data.points > 0) {
                        targetDisplayPoints.innerText = data.points.toLocaleString();
                        targetDisplayPoints.style.display = 'inline-block';
                    } else {
                        targetDisplayPoints.style.display = 'none';
                    }
                } else {
                    targetDisplayContent.classList.remove('show');
                    requestPlaceholder.style.display = 'flex';
                }
            }
        };

        function runGreenScreenEffect() {
            giftCanvasLayer.width = 800;
            giftCanvasLayer.height = 450;

            function processFrame() {
                if (sourceGiftVideo.paused || sourceGiftVideo.ended) return;

                ctx.drawImage(sourceGiftVideo, 0, 0, giftCanvasLayer.width, giftCanvasLayer.height);
                let frame = ctx.getImageData(0, 0, giftCanvasLayer.width, giftCanvasLayer.height);
                let l = frame.data.length;

                for (let i = 0; i < l; i += 4) {
                    let red = frame.data[i];
                    let green = frame.data[i + 1];
                    let blue = frame.data[i + 2];

                    if (green > 90 && green > red * 1.2 && green > blue * 1.2) {
                        frame.data[i + 3] = 0;
                    }
                }

                ctx.putImageData(frame, 0, 0);
                animationId = requestAnimationFrame(processFrame);
            }

            processFrame();
        }
    </script>
</body>
</html>
