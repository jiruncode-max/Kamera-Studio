<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Screen - OBS Vertikal (9:16)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        /* Kontainer Utama Pas 9:16 (Standar Live HP / TikTok) */
        #displayScreen {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 56.25vh; /* Menjaga rasio 9:16 persis tanpa terlalu panjang */
            max-height: 100vw;
            overflow: hidden;
            background: #0f172a;
        }
        #hostVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -10;
        }
        .layout-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; box-sizing: border-box; z-index: 2; pointer-events: none;
        }
        .side-column {
            display: flex; flex-direction: column; gap: 8px; height: 100%; justify-content: center;
        }
        .slot-box {
            width: 70px; height: 70px; background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.6); overflow: hidden;
        }
        .slot-box.filled {
            border-color: #38bdf8; background: rgba(15, 23, 42, 0.95);
        }
        .slot-photo {
            width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
            border: 2px solid #38bdf8; background-color: #334155;
        }
        .default-plus { font-size: 18px; color: #888; font-weight: bold; }
        .default-text { font-size: 8px; color: #888; margin-top: 2px; }

        /* Overlay Gift Full Layar 9:16 Menyesuaikan Video Host */
        #giftOverlayContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; display: flex; justify-content: center; align-items: center;
            pointer-events: none; overflow: hidden;
        }
        #giftCanvas {
            width: 100%; height: 100%; object-fit: cover; display: none;
        }
        #giftVideoSource { display: none; }
    </style>
</head>
<body>

    <div id="displayScreen">
        <!-- Video Background Host -->
        <video id="hostVideo" autoplay loop></video>
        
        <!-- Kotak 1 - 8 Samping Kiri & Kanan -->
        <div class="layout-container">
            <div class="side-column" id="left-column"></div>
            <div class="side-column" id="right-column"></div>
        </div>

        <!-- Animasi Gift Full Layar 9:16 (Green Screen Transparan) -->
        <div id="giftOverlayContainer">
            <video id="giftVideoSource" crossorigin="anonymous" playsinline></video>
            <canvas id="giftCanvas"></canvas>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const leftColumn = document.getElementById('left-column');
        const rightColumn = document.getElementById('right-column');
        const slotsState = {};

        for (let i = 1; i <= 8; i++) {
            slotsState[i] = { username: '', photo: '' };
            const box = document.createElement('div');
            box.className = 'slot-box'; box.id = `display_slot_${i}`;
            box.innerHTML = `<div class="default-plus">+</div><div class="default-text">Kotak ${i}</div>`;
            if (i <= 4) leftColumn.appendChild(box); else rightColumn.appendChild(box);
        }

        const hostVideo = document.getElementById('hostVideo');
        const giftVideo = document.getElementById('giftVideoSource');
        const giftCanvas = document.getElementById('giftCanvas');
        const ctx = giftCanvas.getContext('2d', { willReadFrequently: true });
        let renderInterval = null;

        channel.onmessage = function (event) {
            const data = event.data;

            if (data.type === 'UPDATE_HOST_VIDEO') {
                hostVideo.src = data.url;
                hostVideo.load();
                hostVideo.play().catch(err => console.log("Gagal memutar video host:", err));
            }

            if (data.type === 'TRIGGER_GIFT') {
                giftVideo.src = data.url;
                giftVideo.load();
                giftVideo.currentTime = 0;
                giftVideo.play().then(() => {
                    giftCanvas.style.display = 'block';
                    giftCanvas.width = giftVideo.videoWidth || 720;
                    giftCanvas.height = giftVideo.videoHeight || 1280;
                    
                    if (renderInterval) clearInterval(renderInterval);
                    renderInterval = setInterval(() => {
                        if (giftVideo.paused || giftVideo.ended) {
                            clearInterval(renderInterval);
                            giftCanvas.style.display = 'none';
                            return;
                        }
                        ctx.drawImage(giftVideo, 0, 0, giftCanvas.width, giftCanvas.height);
                        let frame = ctx.getImageData(0, 0, giftCanvas.width, giftCanvas.height);
                        let l = frame.data.length;
                        
                        // Menghapus latar hijau (Chroma Key) agar menyatu mulus dengan video host
                        for (let p = 0; p < l; p += 4) {
                            let red = frame.data[p];
                            let green = frame.data[p + 1];
                            let blue = frame.data[p + 2];
                            
                            if (green > 95 && red < 90 && blue < 90) {
                                frame.data[p + 3] = 0;
                            }
                        }
                        ctx.putImageData(frame, 0, 0);
                    }, 30);
                }).catch(err => console.log("Gagal memutar video gift:", err));
            }

            if (data.type === 'UPDATE_SLOT') {
                slotsState[data.slot] = data.data;
                const box = document.getElementById(`display_slot_${data.slot}`);
                const slot = slotsState[data.slot];

                if (slot.username && slot.photo) {
                    box.classList.add('filled');
                    box.innerHTML = `<img src="${slot.photo}" class="slot-photo" crossorigin="anonymous">`;
                } else {
                    box.classList.remove('filled');
                    box.innerHTML = `<div class="default-plus">+</div><div class="default-text">Kotak ${data.slot}</div>`;
                }
            }
        };
    </script>
</body>
</html>
