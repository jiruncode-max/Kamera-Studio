<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan - Advan Workmate Ryzen 5 Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 3vh;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            transform: scale(0.85);
            transform-origin: center top;
        }

        .board-container { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
            height: 85vh;
            max-height: 650px;
            align-items: center;
            justify-content: center;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 110px;
            height: 100%;
            justify-content: space-between;
        }

        .slot-box {
            border: 2px solid #ffffff; 
            border-radius: 10px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            flex: 1;
        }

        .card-main {
            flex: 1; 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            aspect-ratio: 9 / 16;
            height: 100%;
        }

        .card-main video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .video-host-badge {
            position: absolute; 
            top: 12px; 
            left: 12px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            padding: 4px 12px; 
            background-color: #20D5EC; 
            border-radius: 99px; 
            color: #000000; 
            font-size: 11px; 
            font-weight: 700;
        }

        .video-username-box {
            position: absolute; 
            bottom: 14px; 
            left: 14px;
            z-index: 10; 
            display: inline-flex; 
            align-items: center;
            padding: 5px 14px; 
            background-color: rgba(20, 20, 25, 0.85); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 99px; 
            display: none; 
        }
        .video-username { 
            font-size: 12px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .request-placeholder {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 4px;
            color: #ffffff; 
            user-select: none; 
            width: 100%; 
            height: 100%;
        }
        .request-placeholder .plus-icon { 
            font-size: 34px; 
            font-weight: 800; 
            line-height: 1; 
            color: #ffffff; 
        }
        .request-placeholder .request-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 4px;
            text-align: center;
        }
        .target-display-content.show {
            display: flex;
        }

        /* Elemen Atas Kiri: Kotak Angka */
        .target-top-left {
            position: absolute;
            top: 4px;
            left: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 700;
            color: #ffffff;
            z-index: 5;
        }
        .target-top-left span {
            color: #ffffff;
        }
        .target-top-left .star-circle {
            width: 12px;
            height: 12px;
            background-color: #20D5EC;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .target-top-left svg {
            width: 8px;
            height: 8px;
            fill: #ffffff;
        }

        /* Foto Target Bulat: Crop Bulat, Garis Putih di Dalam, Luar Warna Abu Menonjol */
        .target-avatar-wrapper {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            border: 2px solid #ffffff; /* Garis putih di pinggir icon bulat */
            background-color: #555555; /* Warna abu menonjol di luar/latar belakang foto jika transparan */
            box-shadow: 0 0 6px rgba(100, 100, 100, 0.8);
        }
        .target-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Bagian Bawah: Nama Target + Icon Mikrofon (Dipisah dalam 1 baris) */
        .target-bottom-bar {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 30, 0.9);
            padding: 2px 4px;
            border-radius: 5px;
            z-index: 5;
        }

        .target-name-container {
            display: flex;
            align-items: center;
            gap: 2px;
            overflow: hidden;
        }
        .target-name {
            font-size: 8px;
            font-weight: 600;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 50px;
        }
        .target-bottom-bar .name-plus-icon {
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
            color: #ffffff;
            flex-shrink: 0;
        }

        /* Ikon Mikrofon Mute di Bawah Kanan Bar */
        .target-mic-icon {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 15px;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .target-mic-icon svg {
            width: 8px;
            height: 8px;
            fill: #ffffff;
        }
        .target-mic-icon::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 2px;
            background-color: #ffffff;
            transform: rotate(-45deg);
            top: 50%;
            left: 50%;
            margin-top: -1px;
            margin-left: -5px;
        }

        .giftPopupContainer {
            position: absolute;
            bottom: 52px; 
            left: 14px; 
            background: linear-gradient(90deg, rgba(20,20,25,0.9) 0%, rgba(35,35,45,0.8) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px 6px 6px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateX(-120%);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            max-width: 85%;
        }
        .giftPopupContainer.show {
            transform: translateX(0);
            opacity: 1;
        }
        .popup-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            object-fit: cover;
            flex-shrink: 0;
        }
        .popup-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .popup-name {
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .popup-uname {
            font-size: 9px;
            color: #fbbf24;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .popup-gift-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .popup-count {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
            margin-left: 2px;
        }
        .popup-count.bounce {
            animation: popSpam 0.2s ease-out;
        }

        @keyframes popSpam {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
    </style>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const displayHostUserBox = document.getElementById('displayHostUserBox');
        const displayHostUser = document.getElementById('displayHostUser');
        const giftPopupContainer = document.getElementById('giftPopupContainer');
        const popupAvatar = document.getElementById('popupAvatar');
        const popupName = document.getElementById('popupName');
        const popupUname = document.getElementById('popupUname');
        const popupGiftImg = document.getElementById('popupGiftImg');
        const popupCount = document.getElementById('popupCount');

        let popupTimer = null;

        const defaultCustomPhoto = "https://b.top4top.io/p_3905d2xmz1.jpeg";
        const randomNames = ["J.K 090102", "Siti Rahma", "Budi Santoso", "Dewi Lestari", "Rizky Pratama"];

        function getGiftActionText(count, giftName, giftUrl, targetSlot) {
            let actionText = "Mengirim Kotak 1";
            const numSlot = Number(targetSlot);
            if (!isNaN(numSlot) && numSlot >= 1 && numSlot <= 8) {
                return `Mengirim Kotak ${numSlot}`;
            }

            const numCount = Number(count);
            if (numCount === 5) {
                actionText = "Mengirim Kotak 1";
            } else if (numCount === 10) {
                actionText = "Mengirim Kotak 2";
            } else if (numCount === 15) {
                actionText = "Mengirim Kotak 3";
            } else if (numCount === 20) {
                actionText = "Mengirim Kotak 4";
            } else if (numCount === 30) {
                actionText = "Mengirim Kotak 5";
            } else if (numCount === 99) {
                actionText = "Mengirim Kotak 6";
            } else {
                const textToCheck = (giftName + " " + giftUrl).toLowerCase();
                if (textToCheck.includes('love') || textToCheck.includes('ilu')) {
                    actionText = "Mengirim Kotak 2";
                } else {
                    actionText = "Mengirim Kotak 1";
                }
            }
            return actionText;
        }

        channel.onmessage = (event) => {
            const { type, url, data, count, giftUrl, senderName, senderUname, senderPhoto, giftName, slot } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                displayHostVideo.src = url;
                displayHostVideo.muted = false;
                displayHostVideo.play().catch(e => {
                    console.log("Autoplay dengan suara diblokir browser, klik sekali pada halaman.");
                });
            }

            if (type === 'UPDATE_HOST_USER') {
                displayHostUser.innerText = data || '';
                if (data && data.trim() !== '') {
                    displayHostUserBox.style.display = 'inline-flex';
                } else {
                    displayHostUserBox.style.display = 'none';
                }
            }

            if (type === 'TRIGGER_GIFT_POPUP') {
                const currentHostName = displayHostUser.innerText.trim();
                const chosenName = senderName || (currentHostName !== "" ? currentHostName : randomNames[Math.floor(Math.random() * randomNames.length)]);
                
                const giftActionMessage = getGiftActionText(count, giftName, giftUrl, slot);
                
                popupAvatar.src = senderPhoto || defaultCustomPhoto;
                popupName.innerText = chosenName;
                popupUname.innerText = giftActionMessage; 
                popupGiftImg.src = giftUrl || '';
                popupCount.innerText = `x${count || 1}`;

                popupCount.classList.remove('bounce');
                void popupCount.offsetWidth; 
                popupCount.classList.add('bounce');

                giftPopupContainer.classList.add('show');

                clearTimeout(popupTimer);
                popupTimer = setTimeout(() => {
                    giftPopupContainer.classList.remove('show');
                }, 3000);
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (!data || !data.slot) return;
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                const placeholder = slotEl.querySelector('.request-placeholder');
                const content = slotEl.querySelector('.target-display-content');
                const avatar = slotEl.querySelector('.target-avatar');
                const nameEl = slotEl.querySelector('.target-name');

                if (data.clear) {
                    content.classList.remove('show');
                    placeholder.style.display = 'flex';
                    return;
                }

                if (data.username) {
                    placeholder.style.display = 'none';
                    content.classList.add('show');

                    avatar.src = data.photo || '';
                    nameEl.innerText = data.name || '';
                }
            }
        };

        window.addEventListener('click', () => {
            if (displayHostVideo.paused && displayHostVideo.src) {
                displayHostVideo.muted = false;
                displayHostVideo.play().catch(e => {});
            }
        }, { once: true });
    </script>
</body>
</html>
