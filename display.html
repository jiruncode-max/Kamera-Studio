<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan (Display)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Container untuk 2 kotak (Host & Permintaan) diperkecil */
        .board-container { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
            width: 100%; 
            max-width: 420px; 
            align-items: flex-start;
            justify-content: center;
        }

        .card-main, .card-small {
            flex: 1; 
            border: 2px solid #374151; 
            border-radius: 10px; 
            background-color: #000000;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden; 
            aspect-ratio: 9 / 16;
            max-height: 55vh;
        }

        .card-main video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        .video-host-badge {
            position: absolute; 
            top: 8px; 
            left: 8px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            padding: 2px 8px; 
            background-color: #20D5EC; 
            border-radius: 99px; 
            color: #000000; 
            font-size: 9px; 
            font-weight: 700;
        }

        /* Ikon Bulat Biru dengan Bintang Putih & Angka di Sebelah Kiri (Target) */
        .target-star-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background-color: #0066ff;
            border-radius: 99px;
            padding: 2px 6px 2px 3px;
            color: #ffffff;
            font-size: 9px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .target-star-badge svg {
            width: 10px;
            height: 10px;
            fill: #ffffff;
        }

        .video-username-box {
            position: absolute; 
            bottom: 8px; 
            left: 8px; 
            z-index: 10; 
            display: inline-flex; 
            align-items: center;
            padding: 3px 8px; 
            background-color: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 99px; 
            max-width: calc(100% - 50px);
        }
        .video-username { 
            font-size: 10px; 
            font-weight: 700; 
            color: #ffffff; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Icon Mikrofon di sebelah kanan bawah kotak target */
        .target-mic-box {
            position: absolute;
            bottom: 8px;
            right: 8px;
            z-index: 10;
            width: 24px;
            height: 24px;
            background-color: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .target-mic-box svg {
            width: 12px;
            height: 12px;
            fill: #20D5EC;
        }

        /* Kotak Permintaan / Placeholder */
        .request-placeholder {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 2px;
            color: #ffffff; 
            user-select: none; 
            width: 100%; 
            height: 100%;
        }
        .request-placeholder .plus-icon { 
            font-size: 28px; 
            font-weight: 700; 
            line-height: 1; 
            color: #ffffff; 
        }
        .request-placeholder .request-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ffffff; 
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 10px;
            text-align: center;
        }
        .target-display-content.show {
            display: flex;
        }

        /* Foto Target Bulat Crop */
        .target-avatar-crop {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #20D5EC;
            object-fit: cover;
            margin-bottom: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .target-icon-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            object-fit: contain;
            z-index: 10;
        }

        /* Container untuk Video Gift di bawah 2 kotak tanpa background hijau */
        .gift-video-container {
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            display: none;
            border-radius: 8px;
            overflow: hidden;
            background: transparent;
        }
        .gift-video-container.show {
            display: block;
        }
        .gift-video-container video {
            width: 100%;
            height: auto;
            max-height: 150px;
            object-fit: contain;
            display: block;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="board-container">
        <!-- Kotak Video Host (Kiri) -->
        <div class="card-main">
            <div class="video-host-badge"><span>Host</span></div>
            <video id="displayHostVideo" autoplay muted loop playsinline>
                <source src="https://b.top4top.io/m_3899uvdp01.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Kotak Permintaan / Target (Kanan) -->
        <div class="card-small">
            <div class="request-placeholder" id="requestPlaceholder">
                <span class="plus-icon">+</span>
                <span class="request-text">Permintaan</span>
            </div>

            <div class="target-display-content" id="targetDisplayContent">
                <!-- Ikon Bulat Biru: Bintang Putih & Poin Target di Sebelah Kiri -->
                <div class="target-star-badge">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span id="targetDisplayPoints">0</span>
                </div>

                <!-- Gift Icon di kanan atas -->
                <img id="targetDisplayIcon" class="target-icon-overlay" src="" style="display: none;" alt="Icon">

                <!-- Foto Target Bulat Crop di Tengah -->
                <img id="targetDisplayAvatar" class="target-avatar-crop" src="" alt="Avatar Target">

                <!-- Nama Akun Target di bawah dengan akhiran ' +' -->
                <div class="video-username-box">
                    <span class="video-username" id="targetDisplayName">Nama Target +</span>
                </div>

                <!-- Icon Mikrofon di sebelah kanan bawah kotak target -->
                <div class="target-mic-box">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-.5-.4-.89-.9-.89s-.9.39-.9.89c0 3.33 2.54 6.08 5.75 6.46V21h-2.1v2h6.1v-2h-2.1v-2.58c3.21-.38 5.75-3.13 5.75-6.46 0-.5-.41-.89-.9-.89z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Area Video Gift di Bawah 2 Kotak -->
    <div class="gift-video-container" id="giftVideoContainer">
        <video id="giftVideoElement" autoplay playsinline>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const requestPlaceholder = document.getElementById('requestPlaceholder');
        const targetDisplayContent = document.getElementById('targetDisplayContent');
        const targetDisplayAvatar = document.getElementById('targetDisplayAvatar');
        const targetDisplayIcon = document.getElementById('targetDisplayIcon');
        const targetDisplayName = document.getElementById('targetDisplayName');
        const targetDisplayPoints = document.getElementById('targetDisplayPoints');
        const giftVideoContainer = document.getElementById('giftVideoContainer');
        const giftVideoElement = document.getElementById('giftVideoElement');

        channel.onmessage = (event) => {
            const { type, url, data } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                displayHostVideo.src = url;
                displayHostVideo.play().catch(e => console.log("Autoplay blocked"));
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (data && data.username) {
                    requestPlaceholder.style.display = 'none';
                    targetDisplayContent.classList.add('show');

                    targetDisplayAvatar.src = data.photo || '';
                    
                    let rawName = data.name || data.username || '';
                    if (!rawName.endsWith('+')) {
                        rawName = rawName + ' +';
                    }
                    targetDisplayName.innerText = rawName;

                    if (data.topIcon) {
                        targetDisplayIcon.src = data.topIcon;
                        targetDisplayIcon.style.display = 'block';
                    } else {
                        targetDisplayIcon.style.display = 'none';
                    }

                    if (data.points && data.points > 0) {
                        targetDisplayPoints.innerText = data.points.toLocaleString();
                    } else {
                        targetDisplayPoints.innerText = '0';
                    }
                } else {
                    targetDisplayContent.classList.remove('show');
                    requestPlaceholder.style.display = 'flex';
                }
            }

            if (type === 'PLAY_GIFT_ANIMATION' || type === 'UPDATE_GIFT_VIDEO') {
                if (url) {
                    giftVideoElement.src = url;
                    giftVideoContainer.classList.add('show');
                    giftVideoElement.play().catch(e => console.log("Gift video autoplay blocked"));

                    giftVideoElement.onended = () => {
                        giftVideoContainer.classList.remove('show');
                    };
                }
            }
        };
    </script>
</body>
</html>
