<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Display Studio (9:16)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
        }

        .wrapper-9-16 {
            width: 405px;
            height: 720px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            padding: 15px 12px;
            border: 1px solid #222;
            overflow: hidden;
        }

        /* EFEK VIDEO ANIMASI DIPERKECIL (CONTAIN) AGAR TIDAK NABRAK KOTAK & RASIO ASLI AMAN */
        .bg-video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
            display: none;
            pointer-events: none;
        }

        .main-container {
            display: flex; justify-content: center; align-items: flex-start;
            gap: 8px; width: 100%;
            z-index: 5;
        }

        .side-column { 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 324px; 
        }

        .box {
            width: 72px; height: 75px;
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            position: relative; overflow: hidden;
        }
        .box .plus { font-size: 16px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .box .label { font-size: 7px; margin-top: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .host-box {
            width: 225px; height: 324px;
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 10px;
            position: relative; 
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            overflow: hidden;
        }

        .host-name-bottom {
            position: absolute; bottom: 8px; left: 8px;
            z-index: 10; background-color: rgba(0, 0, 0, 0.7); color: #fff;
            font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.4); white-space: nowrap; max-width: 85%;
            text-overflow: ellipsis; overflow: hidden;
        }

        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; display: none;
            pointer-events: none;
        }

        video::-webkit-media-controls,
        video::-webkit-media-controls-enclosure,
        video::-webkit-media-controls-panel {
            display: none !important;
            opacity: 0 !important;
        }

        .slot-content {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; background: rgba(0, 0, 0, 0.5);
        }
        .slot-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; margin-bottom: 2px; border: 1px solid #fff; }
        .slot-name { font-size: 7px; font-weight: bold; text-align: center; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div class="wrapper-9-16">
        <video class="bg-video-layer" id="bgVideoLayer" autoplay loop playsinline></video>

        <div class="main-container">
            <div class="host-box" id="hostBox">
                <video class="video-bg" id="hostVideo" autoplay loop muted playsinline></video>
                <div class="host-name-bottom" id="hostNameText">J.K 090102</div>
            </div>

            <div class="side-column">
                <div class="box" id="slot-1"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-2"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-3"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-4"><span class="plus">+</span><span class="label">Permintaan</span></div>
            </div>

            <div class="side-column">
                <div class="box" id="slot-5"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-6"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-7"><span class="plus">+</span><span class="label">Permintaan</span></div>
                <div class="box" id="slot-8"><span class="plus">+</span><span class="label">Permintaan</span></div>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const bgVideo = document.getElementById('bgVideoLayer');

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_USER') {
                const nameTag = document.getElementById('hostNameText');
                nameTag.innerText = data ? data : 'J.K 090102';
            }

            if (type === 'UPDATE_HOST_VIDEO') {
                const videoEl = document.getElementById('hostVideo');
                videoEl.src = url;
                videoEl.style.display = 'block';
                videoEl.play().catch(e => console.log(e));
            }

            if (type === 'UPDATE_GS_VIDEO') {
                bgVideo.pause();
                bgVideo.currentTime = 0;
                bgVideo.src = url;
                bgVideo.style.display = 'block';
                bgVideo.load();
                bgVideo.muted = false; 
                bgVideo.play().catch(e => {
                    bgVideo.muted = true;
                    bgVideo.play();
                });
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                if (data.clear) {
                    slotEl.innerHTML = `<span class="plus">+</span><span class="label">Permintaan</span>`;
                } else {
                    slotEl.innerHTML = `
                        <div class="slot-content">
                            <img src="${data.photo}" class="slot-avatar" alt="Avatar">
                            <span class="slot-name">${data.name}</span>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
