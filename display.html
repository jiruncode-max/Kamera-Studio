<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
        }

        /* Container Utama Layout */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 15px;
            padding-top: 15px;
            width: 100%;
        }

        /* Kolom Kotak Sisi Kiri & Kanan (Diperkecil tingginya) */
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .box {
            width: 110px;
            height: 75px; /* Kotak diperkecil agar pas dengan ruang video di bawah */
            border: 2px solid #ffffff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            position: relative;
        }

        .box .plus {
            font-size: 20px;
            font-weight: bold;
        }

        .box .label {
            font-size: 10px;
            margin-top: 2px;
        }

        /* Kotak Host di Tengah */
        .host-box {
            width: 240px;
            height: 331px; /* Menyesuaikan tinggi 4 kotak + gap di samping */
            border: 2px solid #ffffff;
            border-radius: 10px;
            position: relative;
            background-color: #000000;
        }

        .host-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: #00d2ff;
            color: #000;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Bagian Green Screen / Video di Bawah yang Menyatu Rapat */
        .green-screen-container {
            width: 595px; /* Lebar menyamai total lebar grid di atas (kiri + host + kanan) */
            height: 180px; /* Sesuaikan tinggi area video */
            background-color: #00b04f; /* Warna Green Screen */
            position: relative;
            margin-top: 10px;
            border-radius: 0 0 12px 12px; /* Melengkung di bagian bawah, menyatu rata di atas */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Elemen Video / Animasi */
        .green-screen-container video, 
        .green-screen-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Kolom Kiri -->
        <div class="side-column">
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
        </div>

        <!-- Kotak Host Tengah -->
        <div class="host-box">
            <div class="host-badge">Host</div>
        </div>

        <!-- Kolom Kanan -->
        <div class="side-column">
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box"><span class="plus">+</span><span class="label">Permintaan</span></div>
        </div>
    </div>

    <!-- Bagian Video Green Screen di Bawah yang Nempel Rapat -->
    <div class="green-screen-container" id="mediaContainer">
        <!-- Ganti dengan tag <video> jika menggunakan file video .mp4/.webm -->
        <!-- <video src="path-video-anda.webm" autoplay loop muted></video> -->
        <span style="color: white; font-weight: bold;">Area Green Screen / Animasi</span>
    </div>

</body>
</html>
