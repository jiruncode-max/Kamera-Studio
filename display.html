<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Display (OBS)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw;
        }
        .display-live {
            width: 100vw; height: 100vh; position: relative;
            background: #000; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        #hostVideoElement {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        #giftVideoElement {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            z-index: 10; pointer-events: none; display: none;
        }
        /* Diberi jarak agar tidak terlalu mentok bawah/atas kotak target */
        .target-grid {
            position: absolute; bottom: 35px; left: 15px; right: 15px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            z-index: 5; pointer-events: none;
        }
        .target-box {
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 8px; padding: 8px 5px; text-align: center;
            display: none; 
            backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .target-box img.avatar-live {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #38bdf8;
            object-fit: cover; margin-bottom: 5px;
        }
        .target-icon {
            width: 24px; height: 24px; vertical-align: middle; margin-right: 2px;
        }
        .target-name-display {
            font-size: 10px; color: #fff; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-weight: bold;
        }
        .target-points {
            font-size: 10px; color: #fbbf24; font-weight: bold;
        }
        .live-badge {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5);
            padding: 4px 8px; border-radius: 4px; font-size: 10px; color: rgba(255,255,255,0.7);
            z-index: 20; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="display-live" id="displayArea">
        <div class="live-badge">OBS LIVE DISPLAY</div>
        
        <video id="hostVideoElement" loop muted playsinline></video>
        <video id="giftVideoElement" playsinline></video>

        <div class="target-grid" id="liveTargetGrid"></div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        const hostVideoEl = document.getElementById('hostVideoElement');
        const giftVideoEl = document.getElementById('giftVideoElement');
        const liveGrid = document.getElementById('liveTargetGrid');
        const slotData = {};

        for(let i = 1; i <= 8; i++){
            const box = document.createElement('div');
            box.className = 'target-box';
            box.id = `liveSlot_${i}`;
            box.innerHTML = `
                <img id="liveImg_${i}" class="avatar-live" src="" alt="" style="display:none">
                <div style="display:flex; align-items:center; justify-content:center; margin-bottom:4px;">
                    <img id="liveIcon_${i}" class="target-icon" src="" style="display:none">
                </div>
                <span id="liveName_${i}" class="target-name-display"></span>
                <span id="livePoints_${i}" class="target-points"></span>
            `;
            liveGrid.appendChild(box);
        }

        channel.onmessage = (event) => {
            const { type, url, slot, data, slots } = event.data;

            if (type === 'UPDATE_HOST_VIDEO') {
                hostVideoEl.src = url;
                hostVideoEl.play().catch(e => console.log("Autoplay blocked until interaction"));
            }
            
            if (type === 'TRIGGER_GIFT') {
                if(slots) updateLiveGridData(slots);
                
                giftVideoEl.src = url;
                giftVideoEl.style.display = 'block';
                giftVideoEl.play();
                
                giftVideoEl.onended = () => {
                    giftVideoEl.style.display = 'none';
                    giftVideoEl.src = "";
                };
            }

            if (type === 'UPDATE_SLOT') {
                slotData[slot] = data;
                updateLiveGridData(slotData);
            }
        };

        function updateLiveGridData(currentSlots) {
            for(let i = 1; i <= 8; i++){
                const box = document.getElementById(`liveSlot_${i}`);
                const img = document.getElementById(`liveImg_${i}`);
                const icon = document.getElementById(`liveIcon_${i}`);
                const name = document.getElementById(`liveName_${i}`);
                const pts = document.getElementById(`livePoints_${i}`);

                if(currentSlots[i] && currentSlots[i].username) {
                    box.style.display = 'block';
                    img.src = currentSlots[i].photo;
                    img.style.display = 'inline-block';
                    
                    if(currentSlots[i].topIcon) {
                        icon.src = currentSlots[i].topIcon;
                        icon.style.display = 'inline-block';
                    } else {
                        icon.style.display = 'none';
                    }

                    name.innerText = currentSlots[i].name;
                    pts.innerText = currentSlots[i].points ? currentSlots[i].points.toLocaleString() : '';
                } else {
                    box.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
