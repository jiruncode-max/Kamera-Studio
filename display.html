<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Host & Permintaan - Advan Workmate Ryzen 5 Display</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 3vh;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            transform: scale(0.85);
            transform-origin: center top;
        }

        .board-container {
            display: flex;
            flex-direction: row;
            gap: 12px;
            height: 85vh;
            max-height: 650px;
            align-items: center;
            justify-content: center;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 110px;
            height: 100%;
            justify-content: space-between;
        }

        .slot-box {
            border: 2px solid #ffffff;
            border-radius: 10px;
            background-color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
            flex: 1;
        }

        .slot-box.empty {
            background-color: #000000;
            overflow: hidden;
        }

        .card-main {
            flex: 1;
            border: 2px solid #ffffff;
            border-radius: 14px;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            aspect-ratio: 9 / 16;
            height: 100%;
        }

        .card-main video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-host-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            background-color: #20D5EC;
            border-radius: 99px;
            color: #000000;
            font-size: 11px;
            font-weight: 700;
        }

        .video-username-box {
            position: absolute;
            bottom: 14px;
            left: 14px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            padding: 5px 14px;
            background-color: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 99px;
            display: none;
        }

        .video-username {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }

        .request-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #ffffff;
            user-select: none;
            width: 100%;
            height: 100%;
        }

        .request-placeholder .plus-icon {
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
            color: #ffffff;
        }

        .request-placeholder .request-text {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }

        .target-display-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 4px;
            text-align: center;
        }

        .target-display-content.show {
            display: flex;
        }

        .target-top-left {
            position: absolute;
            top: 4px;
            left: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 700;
            color: #ffffff;
            z-index: 5;
        }

        .target-top-left span {
            color: #ffffff;
        }

        .target-top-left .star-circle {
            width: 12px;
            height: 12px;
            background-color: #20D5EC;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .target-top-left svg {
            width: 8px;
            height: 8px;
            fill: #ffffff;
        }

        .floating-gift-anim {
            position: absolute;
            top: -12px;
            right: -6px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            transform: translateY(10px) scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .floating-gift-anim.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .floating-gift-anim img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        .target-avatar-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            border: 2px solid #ffffff;
            background-color: #555555;
            box-shadow: 0 0 10px rgba(130, 130, 130, 0.7);
        }

        .target-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .target-bottom-bar {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
        }

        .target-name-box {
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3px 6px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            max-width: 65px;
            overflow: hidden;
        }

        .target-name-container {
            display: flex;
            align-items: center;
            gap: 2px;
            overflow: hidden;
        }

        .target-name {
            font-size: 8px;
            font-weight: 600;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .target-name-container .name-plus-icon {
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
            color: #ffffff;
            flex-shrink: 0;
        }

        .target-mic-container {
            position: relative;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .target-mic-container svg {
            width: 9px;
            height: 9px;
            fill: #ffffff;
        }

        .target-mic-container::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 2px;
            background-color: #ffffff;
            transform: rotate(-45deg);
            top: 50%;
            left: 50%;
            margin-top: -1px;
            margin-left: -6px;
        }

        .giftPopupContainer {
            position: absolute;
            bottom: 52px;
            left: 14px;
            background: linear-gradient(
                90deg,
                rgba(20,20,25,0.9) 0%,
                rgba(35,35,45,0.8) 100%
            );
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px 6px 6px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateX(-120%);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            max-width: 85%;
        }

        .giftPopupContainer.show {
            transform: translateX(0);
            opacity: 1;
        }

        .popup-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            object-fit: cover;
            flex-shrink: 0;
        }

        .popup-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .popup-name {
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .popup-uname {
            font-size: 9px;
            color: #fbbf24;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .popup-gift-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .popup-count {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
            margin-left: 2px;
        }

        .popup-count.bounce {
            animation: popSpam 0.2s ease-out;
        }

        @keyframes popSpam {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

                        <img class="target-avatar" src="" alt="Avatar">
                    </div>

                    <div class="target-bottom-bar">
                        <div class="target-name-box">
                            <div class="target-name-container">
                                <span class="target-name">asep</span>
                                <span class="name-plus-icon">+</span>
                            </div>
                        </div>

                        <div class="target-mic-container">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>


    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo =
            document.getElementById('displayHostVideo');

        const displayHostUserBox =
            document.getElementById('displayHostUserBox');

        const displayHostUser =
            document.getElementById('displayHostUser');

        const giftPopupContainer =
            document.getElementById('giftPopupContainer');

        const popupAvatar =
            document.getElementById('popupAvatar');

        const popupName =
            document.getElementById('popupName');

        const popupUname =
            document.getElementById('popupUname');

        const popupGiftImg =
            document.getElementById('popupGiftImg');

        const popupCount =
            document.getElementById('popupCount');


        let popupTimer = null;

        const slotTimers = {};


        const defaultCustomPhoto =
            "https://b.top4top.io/p_3905d2xmz1.jpeg";


        const randomNames = [
            "J.K 090102",
            "Siti Rahma",
            "Budi Santoso",
            "Dewi Lestari",
            "Rizky Pratama"
        ];


        /*
         * Menentukan teks popup berdasarkan slot/count.
         */
        function getGiftActionText(count, giftName, giftUrl, targetSlot) {
            const numSlot = Number(targetSlot);

            // Kotak/slot hanya menentukan tempat efek muncul.
            if (Number.isInteger(numSlot) && numSlot >= 1 && numSlot <= 8) {
                return `Mengirim Kotak ${numSlot}`;
            }

            return 'Mengirim Gift';
        }


        channel.onmessage = (event) => {

            const {
                type,
                url,
                data,
                count,
                giftUrl,
                senderName,
                senderUname,
                senderPhoto,
                giftName,
                slot
            } = event.data;


            /*
             * UPDATE VIDEO HOST
             */
            if (type === 'UPDATE_HOST_VIDEO') {

                displayHostVideo.src = url;

                displayHostVideo.muted = false;

                displayHostVideo.play().catch(e => {
                    console.log(
                        "Autoplay dengan suara diblokir browser, klik sekali pada halaman."
                    );
                });
            }


            /*
             * UPDATE USER HOST
             */
            if (type === 'UPDATE_HOST_USER') {

                displayHostUser.innerText = data || '';

                if (
                    data &&
                    data.trim() !== ''
                ) {
                    displayHostUserBox.style.display =
                        'inline-flex';
                } else {
                    displayHostUserBox.style.display =
                        'none';
                }
            }


            /*
             * TRIGGER GIFT
             */
            if (type === 'TRIGGER_GIFT_POPUP') {

                const currentHostName =
                    displayHostUser.innerText.trim();

                const chosenName =
                    senderName ||
                    (
                        currentHostName !== ""
                            ? currentHostName
                            : randomNames[
                                Math.floor(
                                    Math.random() *
                                    randomNames.length
                                )
                            ]
                    );


                /*
                 * Teks popup.
                 */
                const giftActionMessage =
                    getGiftActionText(
                        count,
                        giftName,
                        giftUrl,
                        slot
                    );


                /*
                 * Data popup.
                 */
                popupAvatar.src =
                    senderPhoto ||
                    defaultCustomPhoto;

                popupName.innerText =
                    chosenName;

                popupUname.innerText =
                    giftActionMessage;

                popupGiftImg.src =
                    giftUrl || '';


                /*
                 * Tampilkan jumlah gift asli.
                 *
                 * Contoh:
                 * count = 5  -> x5
                 * count = 15 -> x15
                 * count = 20 -> x20
                 * count = 30 -> x30
                 * count = 99 -> x99
                 */
                const popupGiftCount =
                    Number(count);

                popupCount.innerText =
                    Number.isFinite(popupGiftCount) &&
                    popupGiftCount > 0
                        ? `x${popupGiftCount}`
                        : 'x0';


                /*
                 * Animasi angka popup.
                 */
                popupCount.classList.remove(
                    'bounce'
                );

                void popupCount.offsetWidth;

                popupCount.classList.add(
                    'bounce'
                );


                /*
                 * Tampilkan popup.
                 */
                giftPopupContainer.classList.add(
                    'show'
                );


                clearTimeout(popupTimer);

                popupTimer = setTimeout(() => {

                    giftPopupContainer.classList.remove(
                        'show'
                    );

                }, 3000);


                /*
                 * =====================================================
                 * POIN SLOT
                 * =====================================================
                 *
                 * PENTING:
                 *
                 * count digunakan langsung sebagai poin.
                 *
                 * 5  -> +5
                 * 15 -> +15
                 * 20 -> +20
                 * 30 -> +30
                 * 99 -> +99
                 *
                 * Tidak ada lagi fallback:
                 *
                 * Number(count) || 1
                 *
                 * =====================================================
                 */

                // SLOT HANYA MENENTUKAN LOKASI EFEK.
                // JUMLAH POIN SELALU MENGIKUTI COUNT GIFT.
                const targetSlotNum = Number(slot);


                if (
                    Number.isInteger(targetSlotNum) &&
                    targetSlotNum >= 1 &&
                    targetSlotNum <= 8
                ) {

                    const slotEl =
                        document.getElementById(
                            `slot-${targetSlotNum}`
                        );


                    if (slotEl) {

                        const scoreEl =
                            slotEl.querySelector(
                                '.slot-score'
                            );

                        const floatAnim =
                            slotEl.querySelector(
                                '.floating-gift-anim'
                            );

                        const floatIcon =
                            slotEl.querySelector(
                                '.float-gift-icon'
                            );


                        if (
                            scoreEl &&
                            floatAnim &&
                            floatIcon
                        ) {

                            /*
                             * Ambil COUNT ASLI.
                             */
                            // COUNT = POIN. Jangan memakai slot/kotak sebagai poin.
                            const addScore = Number(count);

                            /*
                             * Abaikan event jika count tidak valid.
                             * Contoh: pilih gift 5 => sender WAJIB mengirim count: 5.
                             */
                            if (
                                !Number.isFinite(addScore) ||
                                addScore <= 0
                            ) {
                                console.warn(
                                    'Count gift tidak valid:',
                                    count
                                );

                                return;
                            }


                            /*
                             * Ambil poin saat ini.
                             */
                            const currentScore =
                                parseInt(
                                    scoreEl.innerText,
                                    10
                                ) || 0;


                            /*
                             * Tambahkan count asli.
                             */
                            const newScore =
                                currentScore +
                                addScore;


                            /*
                             * Tampilkan hasil.
                             */
                            scoreEl.innerText =
                                newScore;


                            /*
                             * Tampilkan ikon gift.
                             */
                            floatIcon.src =
                                giftUrl || '';


                            floatAnim.classList.add(
                                'show'
                            );


                            /*
                             * Reset timer animasi.
                             */
                            clearTimeout(
                                slotTimers[
                                    targetSlotNum
                                ]
                            );


                            slotTimers[
                                targetSlotNum
                            ] = setTimeout(() => {

                                floatAnim.classList.remove(
                                    'show'
                                );

                            }, 3000);

                        }
                    }
                }
            }


            /*
             * UPDATE TARGET SLOT
             */
            if (
                type === 'UPDATE_TARGET_SLOT'
            ) {

                if (
                    !data ||
                    !data.slot
                ) {
                    return;
                }


                const slotEl =
                    document.getElementById(
                        `slot-${data.slot}`
                    );


                if (!slotEl) {
                    return;
                }


                const placeholder =
                    slotEl.querySelector(
                        '.request-placeholder'
                    );

                const content =
                    slotEl.querySelector(
                        '.target-display-content'
                    );

                const avatar =
                    slotEl.querySelector(
                        '.target-avatar'
                    );

                const nameEl =
                    slotEl.querySelector(
                        '.target-name'
                    );

                const scoreEl =
                    slotEl.querySelector(
                        '.slot-score'
                    );


                /*
                 * CLEAR SLOT
                 */
                if (data.clear) {

                    content.classList.remove(
                        'show'
                    );

                    placeholder.style.display =
                        'flex';

                    slotEl.classList.add(
                        'empty'
                    );


                    if (scoreEl) {
                        scoreEl.innerText =
                            '0';
                    }


                    return;
                }


                /*
                 * TAMPILKAN TARGET
                 */
                if (data.username) {

                    placeholder.style.display =
                        'none';

                    content.classList.add(
                        'show'
                    );

                    slotEl.classList.remove(
                        'empty'
                    );


                    avatar.src =
                        data.photo || '';

                    nameEl.innerText =
                        data.name || '';
                }
            }
        };


        /*
         * Klik halaman untuk mengaktifkan
         * video dengan suara jika autoplay
         * diblokir browser.
         */
        window.addEventListener(
            'click',
            () => {

                if (
                    displayHostVideo.paused &&
                    displayHostVideo.src
                ) {

                    displayHostVideo.muted =
                        false;

                    displayHostVideo.play()
                        .catch(e => {});
                }

            },
            {
                once: true
            }
        );
    </script>

</body>
</html>
