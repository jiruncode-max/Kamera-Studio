<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Display Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh;
        }

        .main-container {
            display: flex; justify-content: center; align-items: flex-start;
            gap: 15px; padding-top: 15px; width: 100%;
        }

        .side-column { display: flex; flex-direction: column; gap: 8px; }

        /* Kotak Sisi Kiri & Kanan Diperkecil */
        .box {
            width: 110px; height: 75px;
            border: 2px solid #ffffff; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000000; position: relative; overflow: hidden;
        }
        .box .plus { font-size: 20px; font-weight: bold; }
        .box .label { font-size: 10px; margin-top: 2px; }

        /* Kotak Host di Tengah */
        .host-box {
            width: 240px; height: 331px;
            border: 2px solid #ffffff; border-radius: 10px;
            position: relative; background-color: #000000; overflow: hidden;
        }
        .host-badge {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            background-color: #00d2ff; color: #000; font-size: 10px;
            padding: 2px 8px; border-radius: 10px; font-weight: bold;
        }

        /* Area Background Video Host */
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; display: none;
        }

        /* Area Green Screen di Bawah */
        .green-screen-container {
            width: 595px; height: 180px;
            background-color: #000000;
            position: relative; margin-top: 10px;
            border-radius: 0 0 12px 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Canvas untuk merender video transparan */
        #gsCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Tampilan Slot Aktif (Avatar & Nama) */
        .slot-content {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; background: #000;
        }
        .slot-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-bottom: 4px; border: 1px solid #fff; }
        .slot-name { font-size: 10px; font-weight: bold; text-align: center; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Kolom Kiri: Kotak 1 s.d 4 -->
        <div class="side-column">
            <div class="box" id="slot-1"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box" id="slot-2"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box" id="slot-3"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box" id="slot-4"><span class="plus">+</span><span class="label">Permintaan</span></div>
        </div>

        <!-- Kotak Host Tengah -->
        <div class="host-box" id="hostBox">
            <div class="host-badge" id="hostBadgeText">Host</div>
            <video class="video-bg" id="hostVideo" autoplay loop muted></video>
        </div>

        <!-- Kolom Kanan: Kotak 5 s.d 8 -->
        <div class="side-column">
            <div class="box" id="slot-5"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box" id="slot-6"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box" id="slot-7"><span class="plus">+</span><span class="label">Permintaan</span></div>
            <div class="box" id="slot-8"><span class="plus">+</span><span class="label">Permintaan</span></div>
        </div>
    </div>

    <!-- Bagian Bawah: Video Green Screen Transparan -->
    <div class="green-screen-container" id="gsContainer">
        <video id="gsVideo" src="" autoplay loop muted style="display:none;"></video>
        <canvas id="gsCanvas"></canvas>
        <span id="gsPlaceholder" style="color: #666; font-size: 12px; z-index: 2; position: absolute;">Area Animasi Melayang</span>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const video = document.getElementById('gsVideo');
        const canvas = document.getElementById('gsCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('gsPlaceholder');

        video.addEventListener('play', () => {
            canvas.style.display = 'block';
            placeholder.style.display = 'none';
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 360;

            function processFrame() {
                if (video.paused || video.ended) return;
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = frame.data;

                for (let i = 0; i < data.length; i += 4) {
                    let red = data[i];
                    let green = data[i + 1];
                    let blue = data[i + 2];

                    if (green > 90 && green > red * 1.3 && green > blue * 1.3) {
                        data[i + 3] = 0; // Menghilangkan warna hijau secara real-time
                    }
                }
                
                ctx.putImageData(frame, 0, 0);
                requestAnimationFrame(processFrame);
            }
            requestAnimationFrame(processFrame);
        });

        channel.onmessage = (event) => {
            const { type, data, url } = event.data;

            if (type === 'UPDATE_HOST_USER') {
                const badge = document.getElementById('hostBadgeText');
                badge.innerText = data ? data : 'Host';
            }

            if (type === 'UPDATE_HOST_VIDEO') {
                const videoEl = document.getElementById('hostVideo');
                videoEl.src = url;
                videoEl.style.display = 'block';
                videoEl.play().catch(e => console.log(e));
            }

            if (type === 'UPDATE_GS_VIDEO') {
                video.src = url;
                video.load();
                video.play().catch(e => console.log(e));
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                const slotEl = document.getElementById(`slot-${data.slot}`);
                if (!slotEl) return;

                if (data.clear) {
                    slotEl.innerHTML = `<span class="plus">+</span><span class="label">Permintaan</span>`;
                } else {
                    slotEl.innerHTML = `
                        <div class="slot-content">
                            <img src="${data.photo}" class="slot-avatar" alt="Avatar">
                            <span class="slot-name">${data.name}</span>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
