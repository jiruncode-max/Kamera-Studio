<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TikTok Control & Display</title>
    <style>
        /* CSS Global */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #fff;
        }

        /* Mode Selector (Menu Utama) */
        #modeSelector {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0f172a;
        }
        .selector-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .selector-box h1 { margin-bottom: 25px; font-size: 22px; }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            cursor: pointer;
            border: none;
            font-size: 15px;
        }
        .btn-ctrl { background: #3b82f6; }
        .btn-ctrl:hover { background: #2563eb; }
        .btn-dsp { background: #10b981; }
        .btn-dsp:hover { background: #059669; }

        /* Panel Control Styles */
        #controlPanel {
            max-width: 850px;
            margin: 30px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .grid-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .slot-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .slot-card h4 { margin: 0 0 10px 0; color: #38bdf8; }
        .btn-action {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
            width: 100%;
        }
        .btn-fetch { background: #3b82f6; margin-bottom: 8px; }
        .preview-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 5px;
            display: none;
            border: 2px solid #38bdf8;
        }

        /* Display OBS Styles */
        #displayScreen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: transparent;
            overflow: hidden;
        }
        #hostVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -10;
        }
        .layout-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            box-sizing: border-box;
            z-index: 2;
            pointer-events: none;
        }
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            justify-content: center;
        }
        .slot-box {
            width: 90px;
            height: 90px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .slot-box.filled {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.95);
        }
        .slot-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 4px;
            border: 2px solid #38bdf8;
            background-color: #334155;
        }
        .slot-username {
            font-size: 10px;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            font-weight: bold;
        }
        .default-plus { font-size: 24px; color: #888; font-weight: bold; }
        .default-text { font-size: 10px; color: #888; margin-top: 2px; }

        #giftOverlayContainer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 50%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }
        #giftVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. MENU UTAMA (PILIH MODE) -->
    <div id="modeSelector">
        <div class="selector-box">
            <h1>Pilih Mode Halaman</h1>
            <div class="btn-group">
                <button class="btn btn-ctrl" onclick="setMode('control')">Buka Control Panel</button>
                <button class="btn btn-dsp" onclick="setMode('display')">Buka Display (OBS)</button>
            </div>
        </div>
    </div>

    <!-- 2. CONTROL PANEL -->
    <div id="controlPanel">
        <h2>Control Panel Live TikTok</h2>
        <div class="form-group">
            <label for="hostVideoFile">Upload Video untuk Host (Background Full Layar):</label>
            <input type="file" id="hostVideoFile" accept="video/*">
        </div>

        <div class="form-group">
            <label>Pengaturan Kotak Target (1 - 8):</label>
            <div class="grid-slots" id="slotsContainer"></div>
        </div>

        <div class="form-group">
            <label for="giftSelect">Pilih Animasi Video Gift (Green Screen):</label>
            <select id="giftSelect">
                <option value="">-- Pilih Efek Gift --</option>
                <option value="gift1.mp4">Gift Animasi 1</option>
                <option value="gift2.mp4">Gift Animasi 2</option>
            </select>
            <button class="btn-action" style="background: #10b981; margin-top: 10px;" id="triggerGift">Tampilkan Gift ke Display</button>
        </div>
    </div>

    <!-- 3. DISPLAY SCREEN (UNTUK OBS) -->
    <div id="displayScreen">
        <video id="hostVideo" autoplay muted loop></video>
        <div class="layout-container">
            <div class="side-column" id="left-column"></div>
            <div class="side-column" id="right-column"></div>
        </div>
        <div id="giftOverlayContainer">
            <video id="giftVideo" muted></video>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        
        // Deteksi mode berdasarkan URL (Contoh: ?mode=control atau ?mode=display)
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');

        function setMode(selectedMode) {
            window.location.href = `?mode=${selectedMode}`;
        }

        if (mode === 'control') {
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('controlPanel').style.display = 'block';
            initControlPanel();
        } else if (mode === 'display') {
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('displayScreen').style.display = 'block';
            initDisplayScreen();
        }

        // --- SKRIP CONTROL PANEL ---
        function initControlPanel() {
            document.getElementById('hostVideoFile').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const videoURL = URL.createObjectURL(file);
                    channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: videoURL });
                }
            });

            const slotsContainer = document.getElementById('slotsContainer');
            const slotData = {};

            for (let i = 1; i <= 8; i++) {
                slotData[i] = { username: '', photo: '' };
                const card = document.createElement('div');
                card.className = 'slot-card';
                card.innerHTML = `
                    <h4>Kotak ${i}</h4>
                    <input type="text" placeholder="Masukkan Link / Username TikTok..." id="input_${i}" style="margin-bottom:8px;">
                    <button class="btn-action btn-fetch" onclick="fetchTikTokProfile(${i})">Deteksi Profil Otomatis</button>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img id="preview_${i}" class="preview-img">
                        <span id="status_${i}" style="font-size: 11px; color: #94a3b8;">Belum ada data</span>
                    </div>
                    <button class="btn-action" onclick="clearSlot(${i})" style="background:#64748b;">Reset Kotak ${i}</button>
                `;
                slotsContainer.appendChild(card);
            }

            window.fetchTikTokProfile = function(i) {
                let inputVal = document.getElementById(`input_${i}`).value.trim();
                const statusSpan = document.getElementById(`status_${i}`);
                const previewImg = document.getElementById(`preview_${i}`);

                if (!inputVal) {
                    alert('Masukkan link atau username terlebih dahulu!');
                    return;
                }

                let username = inputVal;
                if (inputVal.includes('tiktok.com/@')) {
                    const match = inputVal.match(/@([a-zA-Z0-9._]+)/);
                    if (match) username = match[1];
                } else {
                    username = username.replace('@', '');
                }

                statusSpan.innerText = "Mendeteksi...";
                
                // Sistem deteksi otomatis menggunakan avatar generator stabil tanpa error CORS
                let avatarUrl = `https://unavatar.io/tiktok/${username}`;
                let testImg = new Image();
                testImg.src = avatarUrl;
                testImg.onload = function() {
                    slotData[i] = { username: '@' + username, photo: avatarUrl };
                    previewImg.src = avatarUrl;
                    previewImg.style.display = 'block';
                    statusSpan.innerText = "Berhasil Terdeteksi!";
                    sendSlotUpdate(i);
                };
                testImg.onerror = function() {
                    let fallbackAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
                    slotData[i] = { username: '@' + username, photo: fallbackAvatar };
                    previewImg.src = fallbackAvatar;
                    previewImg.style.display = 'block';
                    statusSpan.innerText = "Terdeteksi (Fallback)";
                    sendSlotUpdate(i);
                };
            }

            function sendSlotUpdate(slotIndex) {
                channel.postMessage({
                    type: 'UPDATE_SLOT',
                    slot: slotIndex,
                    data: slotData[slotIndex]
                });
            }

            window.clearSlot = function(i) {
                document.getElementById(`input_${i}`).value = '';
                document.getElementById(`preview_${i}`).style.display = 'none';
                document.getElementById(`status_${i}`).innerText = 'Kosong';
                slotData[i] = { username: '', photo: '' };
                sendSlotUpdate(i);
            }

            document.getElementById('triggerGift').addEventListener('click', () => {
                const giftVal = document.getElementById('giftSelect').value;
                if(giftVal) {
                    channel.postMessage({ type: 'TRIGGER_GIFT', gift: giftVal });
                } else {
                    alert('Pilih jenis gift terlebih dahulu!');
                }
            });
        }

        // --- SKRIP DISPLAY SCREEN (OBS) ---
        function initDisplayScreen() {
            const leftColumn = document.getElementById('left-column');
            const rightColumn = document.getElementById('right-column');
            const slotsState = {};

            for (let i = 1; i <= 8; i++) {
                slotsState[i] = { username: '', photo: '' };
                const box = document.createElement('div');
                box.className = 'slot-box';
                box.id = `display_slot_${i}`;
                box.innerHTML = `<div class="default-plus">+</div><div class="default-text">Permintaan</div>`;
                if (i <= 4) leftColumn.appendChild(box);
                else rightColumn.appendChild(box);
            }

            channel.onmessage = function (event) {
                const data = event.data;

                if (data.type === 'UPDATE_HOST_VIDEO') {
                    const hostVideo = document.getElementById('hostVideo');
                    hostVideo.src = data.url;
                    hostVideo.play().catch(err => console.log(err));
                }

                if (data.type === 'UPDATE_SLOT') {
                    slotsState[data.slot] = data.data;
                    const box = document.getElementById(`display_slot_${data.slot}`);
                    const slot = slotsState[data.slot];

                    if (slot.username && slot.photo) {
                        box.classList.add('filled');
                        box.innerHTML = `
                            <img src="${slot.photo}" class="slot-photo" crossorigin="anonymous">
                            <span class="slot-username">${slot.username}</span>
                        `;
                    } else {
                        box.classList.remove('filled');
                        box.innerHTML = `<div class="default-plus">+</div><div class="default-text">Permintaan</div>`;
                    }
                }

                if (data.type === 'TRIGGER_GIFT') {
                    const giftVid = document.getElementById('giftVideo');
                    giftVid.src = data.gift;
                    giftVid.style.display = 'block';
                    giftVid.play().catch(err => console.log(err));
                    giftVid.onended = () => giftVid.style.display = 'none';
                }
            };
        }
    </script>
</body>
</html>
