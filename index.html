<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TikTok - Menu Utama</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: Arial, sans-serif; background-color: #0f172a; color: #fff;
            display: flex; justify-content: center; align-items: center;
        }
        .selector-box {
            background: #1e293b; padding: 40px; border-radius: 16px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .selector-box h1 { margin-top: 0; margin-bottom: 25px; font-size: 22px; }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn {
            padding: 12px 24px; border-radius: 8px; font-weight: bold;
            text-decoration: none; color: white; cursor: pointer; border: none; font-size: 15px;
        }
        .btn-ctrl { background: #3b82f6; }
        .btn-ctrl:hover { background: #2563eb; }
        .btn-dsp { background: #10b981; }
        .btn-dsp:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="selector-box">
        <h1>Pilih Halaman Live TikTok</h1>
        <div class="btn-group">
            <a href="control.html" target="_blank" class="btn btn-ctrl">Buka Control Panel</a>
            <a href="display.html" target="_blank" class="btn btn-dsp">Buka Display (OBS)</a>
        </div>
    </div>
</body>
</html>
