<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Control Panel</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        .control-group { background: #222; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, button { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; }
        button { background: #1890ff; cursor: pointer; font-weight: bold; }
        button:hover { background: #40a9ff; }
        .btn-danger { background: #ff4d4f; }
        .btn-danger:hover { background: #ff7875; }
    </style>
</head>
<body>

    <h2>Control Panel TikTok Live</h2>

    <!-- Host Control -->
    <div class="control-group">
        <label>Nama Host:</label>
        <input type="text" id="hostNameInput" placeholder="Masukkan Nama Host...">
        <button onclick="updateHostName()">Set Nama Host</button>

        <label>URL Video Host:</label>
        <input type="text" id="hostVideoInput" placeholder="Link Video/GIF Host...">
        <button onclick="updateHostVideo()">Set Video Host</button>
    </div>

    <!-- Slot Control -->
    <div class="control-group">
        <label>Pilih Slot (1 - 8):</label>
        <select id="slotSelect">
            <option value="1">Slot 1</option>
            <option value="2">Slot 2</option>
            <option value="3">Slot 3</option>
            <option value="4">Slot 4</option>
            <option value="5">Slot 5</option>
            <option value="6">Slot 6</option>
            <option value="7">Slot 7</option>
            <option value="8">Slot 8</option>
        </select>

        <label>Nama / Format Video (Auto Angka & K/M, misal: User_100K atau 29.999):</label>
        <input type="text" id="slotNameInput" placeholder="Contoh: Budi_50K">

        <label>URL Foto Avatar Slot:</label>
        <input type="text" id="slotPhotoInput" placeholder="Link gambar avatar...">

        <button onclick="updateSlotData()">Isi / Update Slot</button>
        <button class="btn-danger" onclick="clearSlotData()">Kosongkan Slot</button>
    </div>

    <!-- Screen Effect / GS Video Control -->
    <div class="control-group">
        <label>URL Video Efek/GS (Layar Penuh):</label>
        <input type="text" id="gsVideoInput" placeholder="Link video layar penuh...">
        <button onclick="updateGsVideo()">Putar Video Efek</button>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        function updateHostName() {
            const val = document.getElementById('hostNameInput').value;
            channel.postMessage({ type: 'UPDATE_HOST_USER', data: val });
        }

        function updateHostVideo() {
            const val = document.getElementById('hostVideoInput').value;
            channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: val });
        }

        function updateSlotData() {
            const slot = document.getElementById('slotSelect').value;
            const name = document.getElementById('slotNameInput').value;
            const photo = document.getElementById('slotPhotoInput').value;
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data: { slot, name, photo, clear: false } });
        }

        function clearSlotData() {
            const slot = document.getElementById('slotSelect').value;
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data: { slot, clear: true } });
        }

        function updateGsVideo() {
            const val = document.getElementById('gsVideoInput').value;
            channel.postMessage({ type: 'UPDATE_GS_VIDEO', url: val });
        }
    </script>
</body>
</html>
