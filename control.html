<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .grid-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .slot-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .slot-card h4 { margin: 0 0 10px 0; color: #38bdf8; }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Panel Live</h2>
    
    <!-- 1. Input Video Host -->
    <div class="form-group">
        <label for="hostVideoFile">Upload / Pilih Video untuk Host (Background Utama):</label>
        <input type="file" id="hostVideoFile" accept="video/*">
    </div>

    <!-- 2. Input Username TikTok & Pilih Kotak 1-8 -->
    <div class="form-group">
        <label>Input Username TikTok & Alokasi Kotak (1 - 8):</label>
        <div class="grid-slots" id="slotsContainer">
            <!-- Dibuat otomatis via JS -->
        </div>
    </div>

    <!-- 3. Pilih Opsi Video Gift -->
    <div class="form-group">
        <label for="giftSelect">Pilih Animasi Video Gift (Green Screen):</label>
        <select id="giftSelect">
            <option value="">-- Pilih Efek Gift --</option>
            <option value="gift1.mp4">Gift Animasi 1 (Contoh)</option>
            <option value="gift2.mp4">Gift Animasi 2 (Contoh)</option>
        </select>
        <button id="triggerGift" style="background: #10b981; margin-top: 10px; width: 100%;">Tampilkan Gift ke Display</button>
    </div>
</div>

<script>
    const channel = new BroadcastChannel('live_control_channel');

    // 1. Handle Video Host
    const hostVideoFile = document.getElementById('hostVideoFile');
    hostVideoFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const videoURL = URL.createObjectURL(file);
            channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: videoURL });
        }
    });

    // 2. Setup 8 Kotak Input Target TikTok
    const slotsContainer = document.getElementById('slotsContainer');
    const slotData = {};

    for (let i = 1; i <= 8; i++) {
        slotData[i] = { username: '', photo: '' };

        const card = document.createElement('div');
        card.className = 'slot-card';
        card.innerHTML = `
            <h4>Kotak ${i}</h4>
            <input type="text" placeholder="Username TikTok target..." id="user_${i}" data-slot="${i}" style="margin-bottom:8px;">
            <label style="font-size:12px; font-weight:normal;">Upload Foto Bulat Crop:</label>
            <input type="file" accept="image/*" id="photo_${i}" data-slot="${i}">
            <button onclick="clearSlot(${i})" style="width:100%; margin-top:8px;">Reset Kotak ${i}</button>
        `;
        slotsContainer.appendChild(card);
    }

    // Event listener input username & foto
    for (let i = 1; i <= 8; i++) {
        const userInput = document.getElementById(`user_${i}`);
        const photoInput = document.getElementById(`photo_${i}`);

        userInput.addEventListener('input', (e) => {
            slotData[i].username = e.target.value;
            sendSlotUpdate(i);
        });

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    slotData[i].photo = event.target.result;
                    sendSlotUpdate(i);
                };
                reader.readAsDataURL(file);
            }
        });
    }

    function sendSlotUpdate(slotIndex) {
        channel.postMessage({
            type: 'UPDATE_SLOT',
            slot: slotIndex,
            data: slotData[slotIndex]
        });
    }

    window.clearSlot = function(i) {
        document.getElementById(`user_${i}`).value = '';
        document.getElementById(`photo_${i}`).value = '';
        slotData[i] = { username: '', photo: '' };
        sendSlotUpdate(i);
    }

    // 3. Trigger Video Gift (Green Screen di bagian bawah)
    const giftSelect = document.getElementById('giftSelect');
    document.getElementById('triggerGift').addEventListener('click', () => {
        const giftVal = giftSelect.value;
        if(giftVal) {
            channel.postMessage({ type: 'TRIGGER_GIFT', gift: giftVal });
        } else {
            alert('Pilih jenis gift terlebih dahulu!');
        }
    });
</script>

</body>
</html>
