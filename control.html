<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - Live TikTok with Points</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 20px; font-family: Arial, sans-serif;
            background-color: #0f172a; color: #fff;
        }
        .container {
            max-width: 850px; margin: 0 auto; background: #1e293b;
            padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select {
            width: 100%; padding: 10px; background: #0f172a;
            border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; margin-bottom: 8px;
        }
        .btn-action {
            background: #ef4444; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .btn-play { background: #10b981; margin-top: 8px; }
        .btn-install { background: #3b82f6; margin-top: 8px; }
        
        .target-card-inline {
            display: none; align-items: center; gap: 10px; margin-top: 5px; margin-bottom: 8px;
            background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #475569;
        }
        .target-card-inline.show { display: flex; }
        .preview-img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid #38bdf8; flex-shrink: 0;
        }
        .target-info-inline { flex: 1; min-width: 0; }
        .target-name-inline { font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .target-username-inline { font-size: 11px; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control Panel Live TikTok (Poin Gift)</h2>
        
        <div class="form-group">
            <label for="targetInput">Ketik Username/Link TikTok Target:</label>
            <input type="text" placeholder="Contoh: @username atau https://tiktok.com/@username" id="targetInput" oninput="stageProfile()">
            
            <div id="targetCardInline" class="target-card-inline">
                <img id="previewImg" class="preview-img" alt="Avatar">
                <div class="target-info-inline">
                    <div id="targetName" class="target-name-inline">-</div>
                    <div id="targetUsername" class="target-username-inline">-</div>
                </div>
            </div>
            <div id="statusText" style="font-size: 11px; color: #94a3b8; margin-bottom: 5px;">Menunggu input...</div>
        </div>
    </div>

    <script>
        let pendingData = { username: '', name: '', inputVal: '', photo: '' };

        window.stageProfile = async function() {
            let inputVal = document.getElementById('targetInput').value.trim();
            const statusSpan = document.getElementById('statusText');
            const previewImg = document.getElementById('previewImg');
            const targetCardInline = document.getElementById('targetCardInline');
            const nameEl = document.getElementById('targetName');
            const usernameEl = document.getElementById('targetUsername');

            pendingData.inputVal = inputVal;

            if (!inputVal) {
                targetCardInline.classList.remove('show');
                statusSpan.innerText = 'Kosong';
                pendingData.username = '';
                pendingData.name = '';
                pendingData.photo = '';
                return;
            }

            let username = inputVal.includes('tiktok.com/@') ? (inputVal.match(/@([a-zA-Z0-9._]+)/)?.[1] || inputVal) : inputVal.replace('@', '');

            statusSpan.innerText = "Mendeteksi akun...";

            try {
                const targetUrl = `https://www.tiktok.com/@${username}`;
                const oembedApi = `https://www.tiktok.com/oembed?url=${encodeURIComponent(targetUrl)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(oembedApi)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Gagal mengambil data');
                
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);

                if (pendingData.inputVal === inputVal) {
                    let realName = data.author_name || username;
                    let realThumb = data.thumbnail_url || `https://unavatar.io/tiktok/${username}`;

                    pendingData.username = '@' + username;
                    pendingData.name = realName;
                    pendingData.photo = realThumb;
                    
                    previewImg.src = realThumb;
                    nameEl.innerText = realName;
                    usernameEl.innerText = '@' + username;
                    targetCardInline.classList.add('show');
                    statusSpan.innerText = "Berhasil akurat!";
                }
            } catch (error) {
                if (pendingData.inputVal === inputVal) {
                    let fallbackName = username.charAt(0).toUpperCase() + username.slice(1);
                    let fallbackAvatar = `https://unavatar.io/tiktok/${username}`;

                    pendingData.username = '@' + username;
                    pendingData.name = fallbackName;
                    pendingData.photo = fallbackAvatar;
                    
                    previewImg.src = fallbackAvatar;
                    nameEl.innerText = fallbackName;
                    usernameEl.innerText = '@' + username;
                    targetCardInline.classList.add('show');
                    statusSpan.innerText = "Siap (Metode Alternatif)!";
                }
            }
        }
    </script>
</body>
</html>
