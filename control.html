<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - Live TikTok</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .grid-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .slot-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .slot-card h4 { margin: 0 0 10px 0; color: #38bdf8; }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }
        button:hover { background: #dc2626; }
        .btn-fetch { background: #3b82f6; width: 100%; margin-bottom: 8px; }
        .btn-fetch:hover { background: #2563eb; }
        .preview-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 5px;
            display: none;
            border: 2px solid #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Panel Live TikTok</h2>
    
    <!-- 1. Input Video Host -->
    <div class="form-group">
        <label for="hostVideoFile">Upload Video untuk Host (Background):</label>
        <input type="file" id="hostVideoFile" accept="video/*">
    </div>

    <!-- 2. Kotak 1 - 8 (Sistem Otomatis & Link Profil TikTok) -->
    <div class="form-group">
        <label>Pengaturan Kotak Target (1 - 8):</label>
        <div class="grid-slots" id="slotsContainer"></div>
    </div>

    <!-- 3. Pilih Opsi Video Gift -->
    <div class="form-group">
        <label for="giftSelect">Pilih Animasi Video Gift (Green Screen):</label>
        <select id="giftSelect">
            <option value="">-- Pilih Efek Gift --</option>
            <option value="gift1.mp4">Gift Animasi 1</option>
            <option value="gift2.mp4">Gift Animasi 2</option>
        </select>
        <button id="triggerGift" style="background: #10b981; margin-top: 10px; width: 100%;">Tampilkan Gift ke Display</button>
    </div>
</div>

<script>
    const channel = new BroadcastChannel('live_control_channel');

    // Handle Video Host
    document.getElementById('hostVideoFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const videoURL = URL.createObjectURL(file);
            channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: videoURL });
        }
    });

    // Inisialisasi 8 Kotak
    const slotsContainer = document.getElementById('slotsContainer');
    const slotData = {};

    for (let i = 1; i <= 8; i++) {
        slotData[i] = { username: '', photo: '' };

        const card = document.createElement('div');
        card.className = 'slot-card';
        card.innerHTML = `
            <h4>Kotak ${i}</h4>
            <input type="text" placeholder="Masukkan Link / Username TikTok..." id="input_${i}" style="margin-bottom:8px;">
            <button class="btn-fetch" onclick="fetchTikTokProfile(${i})">Deteksi Profil Otomatis</button>
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="preview_${i}" class="preview-img">
                <span id="status_${i}" style="font-size: 11px; color: #94a3b8;">Belum ada data</span>
            </div>
            <button onclick="clearSlot(${i})" style="width:100%; background:#64748b;">Reset Kotak ${i}</button>
        `;
        slotsContainer.appendChild(card);
    }

    // Fungsi Deteksi Otomatis menggunakan API publik / TikPaw fallback parser
    window.fetchTikTokProfile = async function(i) {
        let inputVal = document.getElementById(`input_${i}`).value.trim();
        const statusSpan = document.getElementById(`status_${i}`);
        const previewImg = document.getElementById(`preview_${i}`);

        if (!inputVal) {
            alert('Masukkan link atau username terlebih dahulu!');
            return;
        }

        // Ekstrak username jika berupa link lengkap (misal: https://www.tiktok.com/@username)
        let username = inputVal;
        if (inputVal.includes('tiktok.com/@')) {
            const match = inputVal.match(/@([a-zA-Z0-9._]+)/);
            if (match) username = match[1];
        } else {
            username = username.replace('@', '');
        }

        statusSpan.innerText = "Mendeteksi...";
        
        try {
            // Menggunakan layanan pihak ketiga CORS-friendly untuk mengambil data profil atau menggunakan avatar generator publik jika diblokir TikTok
            // Sebagai alternatif yang stabil dan akurat tanpa API Key berbayar, kita gunakan avatar instan berdasarkan username
            let avatarUrl = `https://unavatar.io/tiktok/${username}`;
            
            // Verifikasi apakah gambar aktif/valid
            let testImg = new Image();
            testImg.src = avatarUrl;
            testImg.onload = function() {
                slotData[i] = { username: '@' + username, photo: avatarUrl };
                previewImg.src = avatarUrl;
                previewImg.style.display = 'block';
                statusSpan.innerText = "Berhasil Terdeteksi!";
                sendSlotUpdate(i);
            };
            testImg.onerror = function() {
                // Fallback jika unavatar gagal
                let fallbackAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
                slotData[i] = { username: '@' + username, photo: fallbackAvatar };
                previewImg.src = fallbackAvatar;
                previewImg.style.display = 'block';
                statusSpan.innerText = "Terdeteksi (Fallback)";
                sendSlotUpdate(i);
            };

        } catch (error) {
            statusSpan.innerText = "Gagal mendeteksi!";
            console.error(error);
        }
    }

    function sendSlotUpdate(slotIndex) {
        channel.postMessage({
            type: 'UPDATE_SLOT',
            slot: slotIndex,
            data: slotData[slotIndex]
        });
    }

    window.clearSlot = function(i) {
        document.getElementById(`input_${i}`).value = '';
        document.getElementById(`preview_${i}`).style.display = 'none';
        document.getElementById(`status_${i}`).innerText = 'Kosong';
        slotData[i] = { username: '', photo: '' };
        sendSlotUpdate(i);
    }

    // Trigger Gift
    const giftSelect = document.getElementById('giftSelect');
    document.getElementById('triggerGift').addEventListener('click', () => {
        const giftVal = giftSelect.value;
        if(giftVal) {
            channel.postMessage({ type: 'TRIGGER_GIFT', gift: giftVal });
        } else {
            alert('Pilih jenis gift terlebih dahulu!');
        }
    });
</script>

</body>
</html>
