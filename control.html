<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121214;
            color: #ffffff;
            padding: 20px;
        }
        h2 {
            margin-bottom: 15px;
            color: #20D5EC;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #1a1a1e;
            border: 1px solid #2a2a30;
            padding: 15px;
            border-radius: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input, select {
            padding: 8px 12px;
            background: #25252b;
            border: 1px solid #3a3a45;
            color: white;
            border-radius: 6px;
            flex: 1;
            min-width: 150px;
        }
        button {
            padding: 8px 16px;
            background: #20D5EC;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        .danger-btn {
            background: #ef4444;
            color: white;
        }
        
        /* Panel Tombol Gift Spam */
        .gift-control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .gift-btn {
            background: #25252b;
            border: 1px solid #3a3a45;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .gift-btn:hover {
            border-color: #fbbf24;
            background: #2f2f38;
        }
        .gift-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .gift-btn span {
            font-size: 11px;
            font-weight: bold;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel Kontrol TikTok Live</h2>

        <!-- Pengaturan Video Host Utama -->
        <div class="card">
            <h3>1. Setel Video Host Utama</h3>
            <div class="input-group" style="margin-top: 10px;">
                <input type="text" id="hostVideoUrl" placeholder="Masukkan URL Video MP4 Host...">
                <button onclick="updateHostVideo()">Terapkan Video</button>
            </div>
            <div class="input-group">
                <input type="text" id="hostUsernameInput" placeholder="Nama/User Host (cth: @komal)...">
                <button onclick="updateHostUsername()">Terapkan Nama Host</button>
            </div>
        </div>

        <!-- Pengaturan 8 Slot Permintaan / Penonton -->
        <div class="card">
            <h3>2. Kelola Slot Penonton (1 - 8)</h3>
            <div class="input-group" style="margin-top: 10px;">
                <select id="slotSelector">
                    <option value="1">Slot 1</option>
                    <option value="2">Slot 2</option>
                    <option value="3">Slot 3</option>
                    <option value="4">Slot 4</option>
                    <option value="5">Slot 5</option>
                    <option value="6">Slot 6</option>
                    <option value="7">Slot 7</option>
                    <option value="8">Slot 8</option>
                </select>
                <input type="text" id="targetName" placeholder="Nama Lengkap">
                <input type="text" id="targetUsername" placeholder="@username">
                <input type="text" id="targetPhoto" placeholder="URL Foto Profil">
            </div>
            <div class="input-group">
                <button onclick="saveSlot()">Simpan ke Slot</button>
                <button class="danger-btn" onclick="clearSlot()">Kosongkan Slot</button>
            </div>
        </div>

        <!-- Panel Trigger Gift Spam -->
        <div class="card">
            <h3>3. Kirim Gift (Klik berulang untuk Spam x1, x2, x3...)</h3>
            <p style="font-size: 12px; color: #a1a1aa; margin-bottom: 10px;">Pilih dulu slot penonton yang mengirim gift di atas, lalu klik ikon gift di bawah:</p>
            <div class="gift-control-panel">
                <div class="gift-btn" onclick="sendGift('https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp', 5)">
                    <img src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp" alt="Gift 5">
                    <span>Nilai: 5</span>
                </div>
                <div class="gift-btn" onclick="sendGift('https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/beaaa3a78a00b5b20661b00924ab0e7f~tplv-obj.webp', 10)">
                    <img src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/beaaa3a78a00b5b20661b00924ab0e7f~tplv-obj.webp" alt="Gift 10">
                    <span>Nilai: 10</span>
                </div>
                <div class="gift-btn" onclick="sendGift('https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/075e206d6da035f10ff5f8fecd82abcc.png~tplv-obj.webp', 15)">
                    <img src="https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/075e206d6da035f10ff5f8fecd82abcc.png~tplv-obj.webp" alt="Gift 15">
                    <span>Nilai: 15</span>
                </div>
                <div class="gift-btn" onclick="sendGift('https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/20b8f61246c7b6032777bb81bf4ee055~tplv-obj.webp', 20)">
                    <img src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/20b8f61246c7b6032777bb81bf4ee055~tplv-obj.webp" alt="Gift 20">
                    <span>Nilai: 20</span>
                </div>
                <div class="gift-btn" onclick="sendGift('https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp', 30)">
                    <img src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp" alt="Gift 30">
                    <span>Nilai: 30</span>
                </div>
                <div class="gift-btn" onclick="sendGift('https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/2f1e4f3f5c728ffbfa35705b480fdc92~tplv-obj.webp', 99)">
                    <img src="https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/2f1e4f3f5c728ffbfa35705b480fdc92~tplv-obj.webp" alt="Gift 99">
                    <span>Nilai: 99</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        
        // Objek untuk melacak jumlah spam gift berdasarkan URL gift & slot
        let giftCounters = {};

        function updateHostVideo() {
            const url = document.getElementById('hostVideoUrl').value;
            if (url) {
                channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: url });
            }
        }

        function updateHostUsername() {
            const username = document.getElementById('hostUsernameInput').value;
            channel.postMessage({ type: 'UPDATE_HOST_USER', data: username });
        }

        function saveSlot() {
            const slot = document.getElementById('slotSelector').value;
            const name = document.getElementById('targetName').value;
            const username = document.getElementById('targetUsername').value;
            const photo = document.getElementById('targetPhoto').value;

            channel.postMessage({
                type: 'UPDATE_TARGET_SLOT',
                data: { slot, name, username, photo, clear: false }
            });
        }

        function clearSlot() {
            const slot = document.getElementById('slotSelector').value;
            channel.postMessage({
                type: 'UPDATE_TARGET_SLOT',
                data: { slot, clear: true }
            });
        }

        function sendGift(giftUrl, giftId) {
            const slot = document.getElementById('slotSelector').value;
            const key = `${slot}_${giftUrl}`;

            // Jika gift sama diklik lagi dalam waktu dekat atau berturut-turut, naikkan hitungannya (Spam x1, x2, x3...)
            if (!giftCounters[key]) {
                giftCounters[key] = { count: 1, lastTime: Date.now() };
            } else {
                // Reset hitungan jika jeda waktu lebih dari 6 detik
                if (Date.now() - giftCounters[key].lastTime > 6000) {
                    giftCounters[key].count = 1;
                } else {
                    giftCounters[key].count += 1;
                }
                giftCounters[key].lastTime = Date.now();
            }

            channel.postMessage({
                type: 'TRIGGER_GIFT_POPUP',
                slot: slot,
                giftUrl: giftUrl,
                count: giftCounters[key].count
            });
        }
    </script>
</body>
</html>
