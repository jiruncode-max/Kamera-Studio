<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Control Panel</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .grid-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .slot-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .slot-card h4 { margin: 0 0 10px 0; color: #38bdf8; }
        .btn-action {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
            width: 100%;
        }
        .btn-fetch { background: #3b82f6; margin-bottom: 8px; }
        .preview-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 5px;
            display: none;
            border: 2px solid #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Panel Live TikTok</h2>
    
    <!-- Input Video Host -->
    <div class="form-group">
        <label>Upload Video untuk Host:</label>
        <input type="file" id="hostVideoFile" accept="video/*">
    </div>

    <!-- Kotak 1 - 8 (Foto Bulat Crop) -->
    <div class="form-group">
        <label>Pengaturan Kotak Target (1 - 8) - Foto Bulat Crop:</label>
        <div class="grid-slots" id="slotsContainer"></div>
    </div>

    <!-- Pilih Opsi Video Gift -->
    <div class="form-group">
        <label>Pilih Efek Animasi Gift (Green Screen):</label>
        <select id="giftSelect">
            <option value="">-- Pilih Efek Gift --</option>
            <option value="gift1.mp4">Animasi Gift 1</option>
            <option value="gift2.mp4">Animasi Gift 2</option>
        </select>
        <button class="btn-action" style="background: #10b981; margin-top: 10px;" id="triggerGift">Tampilkan Gift ke Display</button>
    </div>
</div>

<script>
    const channel = new BroadcastChannel('live_control_channel');

    // Handle Upload Video Host
    document.getElementById('hostVideoFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const videoURL = URL.createObjectURL(file);
            channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: videoURL });
        }
    });

    // Inisialisasi Kotak 1-8
    const slotsContainer = document.getElementById('slotsContainer');
    const slotData = {};

    for (let i = 1; i <= 8; i++) {
        slotData[i] = { photo: '' };
        const card = document.createElement('div');
        card.className = 'slot-card';
        card.innerHTML = `
            <h4>Kotak ${i}</h4>
            <input type="text" placeholder="Username / Link TikTok..." id="input_${i}" style="margin-bottom:8px;">
            <button class="btn-action btn-fetch" onclick="fetchTikTokProfile(${i})">Deteksi Foto Otomatis</button>
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="preview_${i}" class="preview-img">
                <span id="status_${i}" style="font-size: 11px; color: #94a3b8;">Belum ada data</span>
            </div>
            <button class="btn-action" onclick="clearSlot(${i})" style="background:#64748b;">Reset Kotak ${i}</button>
        `;
        slotsContainer.appendChild(card);
    }

    window.fetchTikTokProfile = function(i) {
        let inputVal = document.getElementById(`input_${i}`).value.trim();
        const statusSpan = document.getElementById(`status_${i}`);
        const previewImg = document.getElementById(`preview_${i}`);

        if (!inputVal) {
            alert('Masukkan link atau username terlebih dahulu!');
            return;
        }

        let username = inputVal;
        if (inputVal.includes('tiktok.com/@')) {
            const match = inputVal.match(/@([a-zA-Z0-9._]+)/);
            if (match) username = match[1];
        } else {
            username = username.replace('@', '');
        }

        statusSpan.innerText = "Mendeteksi...";
        let avatarUrl = `https://unavatar.io/tiktok/${username}`;
        
        let testImg = new Image();
        testImg.src = avatarUrl;
        testImg.onload = function() {
            slotData[i] = { photo: avatarUrl };
            previewImg.src = avatarUrl;
            previewImg.style.display = 'block';
            statusSpan.innerText = "Berhasil (Bulat Crop)";
            sendSlotUpdate(i);
        };
        testImg.onerror = function() {
            let fallbackAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
            slotData[i] = { photo: fallbackAvatar };
            previewImg.src = fallbackAvatar;
            previewImg.style.display = 'block';
            statusSpan.innerText = "Terdeteksi (Fallback)";
            sendSlotUpdate(i);
        };
    }

    function sendSlotUpdate(slotIndex) {
        channel.postMessage({ type: 'UPDATE_SLOT', slot: slotIndex, data: slotData[slotIndex] });
    }

    window.clearSlot = function(i) {
        document.getElementById(`input_${i}`).value = '';
        document.getElementById(`preview_${i}`).style.display = 'none';
        document.getElementById(`status_${i}`).innerText = 'Kosong';
        slotData[i] = { photo: '' };
        sendSlotUpdate(i);
    }

    // Trigger Gift
    document.getElementById('triggerGift').addEventListener('click', () => {
        const giftVal = document.getElementById('giftSelect').value;
        if(giftVal) {
            channel.postMessage({ type: 'TRIGGER_GIFT', gift: giftVal });
        } else {
            alert('Pilih jenis gift terlebih dahulu!');
        }
    });
</script>

</body>
</html>
