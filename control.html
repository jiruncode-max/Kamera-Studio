<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .control-panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { font-size: 18px; margin-bottom: 15px; text-align: center; }
        .control-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="file"], button {
            width: 100%;
            padding: 8px;
            background: #00d2ff;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #00a8cc; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>Panel Kontrol Green Screen</h2>
        <div class="control-group">
            <label for="uploadVideo">Unggah Video/Animasi:</label>
            <input type="file" id="uploadVideo" accept="video/*">
        </div>
    </div>

</body>
</html>
