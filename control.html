    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        h2 { margin-bottom: 15px; font-size: 18px; color: #20D5EC; }
        .section { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; }

        button { background: #20D5EC; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #1bc0d4; }
        .file-info { font-size: 11px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Control Panel Live</h2>

    <div class="section">
        <label>Ubah Informasi Host (Kotak Kiri)</label>
        <input type="text" id="hostUsernameInput" placeholder="Username / Nama Host" value="Host">
        <label>Ubah Video Host (URL / Link)</label>
        <input type="text" id="hostVideoUrl" placeholder="URL Video Host (mp4)" value="https://b.top4top.io/m_3899uvdp01.mp4">
        <label>Atau Pilih File Video Host (Lokal)</label>
        <input type="file" id="hostVideoFile" accept="video/*">
        <div class="file-info">Pilih file video dari perangkat jika tidak menggunakan URL.</div>
        <button onclick="updateHostSettings()">Terapkan Pengaturan Host</button>
    </div>

    <div class="section">
        <label>Atur Kotak Permintaan / Target (Kanan)</label>
        <input type="text" id="targetUsername" placeholder="Username / Nama Target">
        <input type="text" id="targetPhoto" placeholder="URL Foto Profil Avatar">
        <input type="text" id="targetIcon" placeholder="URL Icon Gift (Kanan Atas)">
        <input type="number" id="targetPoints" placeholder="Jumlah Poin" value="0">
        <button onclick="updateTargetSlot()">Simpan Target</button>
        <button onclick="clearTargetSlot()" style="background: #ef4444; color: #fff; margin-top: 5px;">Hapus Target</button>
    </div>

    <div class="section">
        <label>Putar Video Gift / Animasi (Muncul di Bawah 2 Kotak)</label>
        <input type="text" id="giftVideoUrl" placeholder="URL Video Gift (mp4)">
        <button onclick="playGiftVideo()">Putar Gift Video</button>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        function updateHostSettings() {
            const username = document.getElementById('hostUsernameInput').value;
            const url = document.getElementById('hostVideoUrl').value;
            const fileInput = document.getElementById('hostVideoFile');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    channel.postMessage({
                        type: 'UPDATE_HOST_SETTINGS',
                        username: username,
                        videoSrc: e.target.result
                    });
                    alert('Host (File Video & Nama) diperbarui!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                channel.postMessage({
                    type: 'UPDATE_HOST_SETTINGS',
                    username: username,
                    videoSrc: url
                });
                alert('Host (URL Video & Nama) diperbarui!');
            }
        }

        function updateTargetSlot() {
            const data = {
                username: document.getElementById('targetUsername').value,
                name: document.getElementById('targetUsername').value,
                photo: document.getElementById('targetPhoto').value,
                topIcon: document.getElementById('targetIcon').value,
                points: parseInt(document.getElementById('targetPoints').value) || 0
            };
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data });
            alert('Data target diperbarui!');
        }

        function clearTargetSlot() {
            document.getElementById('targetUsername').value = '';
            document.getElementById('targetPhoto').value = '';
            document.getElementById('targetIcon').value = '';
            document.getElementById('targetPoints').value = '0';
            channel.postMessage({ type: 'UPDATE_TARGET_SLOT', data: null });
            alert('Target dikosongkan!');
        }

        function playGiftVideo() {
            const url = document.getElementById('giftVideoUrl').value;
            if (url) {
                channel.postMessage({ type: 'PLAY_GIFT_ANIMATION', url });
            }
        }
    </script>
</body>
</html>

<body>

    <div class="board-container">
        <!-- Kotak Video Host (Kiri) -->
        <div class="card-main">
            <div class="video-host-badge"><span>Host</span></div>
            <video id="displayHostVideo" autoplay muted loop playsinline>
                <source src="https://b.top4top.io/m_3899uvdp01.mp4" type="video/mp4">
            </video>
            <div class="video-username-box">
                <span class="video-username" id="displayHostUsername">Host</span>
            </div>
        </div>

        <!-- Kotak Permintaan / Target (Kanan) -->
        <div class="card-small">
            <div class="request-placeholder" id="requestPlaceholder">
                <span class="plus-icon">+</span>
                <span class="request-text">Permintaan</span>
            </div>

            <div class="target-display-content" id="targetDisplayContent">
                <div class="target-star-badge">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span id="targetDisplayPoints">0</span>
                </div>

                <img id="targetDisplayIcon" class="target-icon-overlay" src="" style="display: none;" alt="Icon">
                <img id="targetDisplayAvatar" class="target-avatar-crop" src="" alt="Avatar Target">

                <div class="video-username-box">
                    <span class="video-username" id="targetDisplayName">Nama Target +</span>
                </div>

                <div class="target-mic-box">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-.5-.4-.89-.9-.89s-.9.39-.9.89c0 3.33 2.54 6.08 5.75 6.46V21h-2.1v2h6.1v-2h-2.1v-2.58c3.21-.38 5.75-3.13 5.75-6.46 0-.5-.41-.89-.9-.89z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Area Video Gift di Bawah 2 Kotak -->
    <div class="gift-video-container" id="giftVideoContainer">
        <video id="giftVideoElement" autoplay playsinline>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');

        const displayHostVideo = document.getElementById('displayHostVideo');
        const displayHostUsername = document.getElementById('displayHostUsername');
        const requestPlaceholder = document.getElementById('requestPlaceholder');
        const targetDisplayContent = document.getElementById('targetDisplayContent');
        const targetDisplayAvatar = document.getElementById('targetDisplayAvatar');
        const targetDisplayIcon = document.getElementById('targetDisplayIcon');
        const targetDisplayName = document.getElementById('targetDisplayName');
        const targetDisplayPoints = document.getElementById('targetDisplayPoints');
        const giftVideoContainer = document.getElementById('giftVideoContainer');
        const giftVideoElement = document.getElementById('giftVideoElement');

        channel.onmessage = (event) => {
            const { type, url, username, videoSrc, data } = event.data;

            if (type === 'UPDATE_HOST_SETTINGS') {
                if (username) {
                    displayHostUsername.innerText = username;
                }
                if (videoSrc) {
                    displayHostVideo.src = videoSrc;
                    displayHostVideo.play().catch(e => console.log("Host video autoplay blocked"));
                }
            }

            if (type === 'UPDATE_TARGET_SLOT') {
                if (data && data.username) {
                    requestPlaceholder.style.display = 'none';
                    targetDisplayContent.classList.add('show');

                    targetDisplayAvatar.src = data.photo || '';
                    
                    let rawName = data.name || data.username || '';
                    if (!rawName.endsWith('+')) {
                        rawName = rawName + ' +';
                    }
                    targetDisplayName.innerText = rawName;

                    if (data.topIcon) {
                        targetDisplayIcon.src = data.topIcon;
                        targetDisplayIcon.style.display = 'block';
                    } else {
                        targetDisplayIcon.style.display = 'none';
                    }

                    if (data.points && data.points > 0) {
                        targetDisplayPoints.innerText = data.points.toLocaleString();
                    } else {
                        targetDisplayPoints.innerText = '0';
                    }
                } else {
                    targetDisplayContent.classList.remove('show');
                    requestPlaceholder.style.display = 'flex';
                }
            }

            if (type === 'PLAY_GIFT_ANIMATION') {
                if (url) {
                    giftVideoElement.src = url;
                    giftVideoContainer.classList.add('show');
                    giftVideoElement.play().catch(e => console.log("Gift video autoplay blocked"));

                    giftVideoElement.onended = () => {
                        giftVideoContainer.classList.remove('show');
                    };
                }
            }
        };
    </script>
