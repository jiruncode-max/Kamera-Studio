<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Control Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #050505; color: #fff; overflow-x: hidden; min-height: 100vh;
        }
        .control-panel {
            width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; 
            background: #0f172a; overflow-y: auto; border: 2px solid #334155;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; font-size: 1.2rem; color: #38bdf8; }
        .form-group { margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #94a3b8; }
        input[type="text"], select {
            width: 100%; padding: 10px; background: #020617;
            border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; margin-bottom: 8px; outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        .grid-slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .slot-card {
            background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155;
        }
        .slot-card h4 { margin: 0 0 10px 0; color: #38bdf8; font-size: 0.95rem; }
        .btn-action {
            background: #ef4444; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-play { background: #10b981; margin-top: 8px; }
        .target-card-inline {
            display: none; align-items: center; gap: 10px; margin-top: 5px; margin-bottom: 8px;
            background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #475569;
        }
        .target-card-inline.show { display: flex; }
        .preview-img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid #38bdf8; flex-shrink: 0;
        }
        .target-info-inline { flex: 1; min-width: 0; }
        .target-name-inline { font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .target-username-inline { font-size: 11px; color: #38bdf8; }
        .status-msg { font-size: 11px; color: #94a3b8; margin-bottom: 5px; min-height: 16px; }
        .status-msg.loading { color: #facc15; }
        .status-msg.success { color: #4ade80; }
        .status-msg.error { color: #f87171; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>Control Panel (Pro System)</h2>
        
        <!-- Input Video Host -->
        <div class="form-group">
            <label for="hostVideoFile">1. Upload Video Host (Background):</label>
            <input type="file" id="hostVideoFile" accept="video/*">
            <button class="btn-action btn-play" onclick="playHostVideo()">Putar Video Host</button>
        </div>

        <!-- Input Video Gift -->
        <div class="form-group">
            <label for="giftVideoFile">2. Upload Animasi Gift (Overlay):</label>
            <input type="file" id="giftVideoFile" accept="video/*">
            <button class="btn-action btn-play" onclick="playGiftVideo()">Putar Gift Animasi</button>
        </div>

        <!-- Slot Manager -->
        <div class="form-group">
            <label>3. Atur Target Slot (1 - 8):</label>
            <div class="grid-slots" id="slotsContainer"></div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('live_control_channel');
        
        const slotData = {};
        const pendingData = {};
        let hostVideoUrl = '';
        let giftVideoUrl = '';

        const iconOptions = [
            { name: "Pilih Ikon...", url: "", points: 0 },
            { name: "Paus", url: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/291de897e4a8c3b72c358a9734c5b7d8.png~tplv-obj.webp", points: 6000 },
            { name: "Singa", url: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp", points: 29999 },
            { name: "Robot", url: "https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/0a295ee8674ff2a9a05ef8e9151bbe75.png~tplv-obj.webp", points: 18999 },
            { name: "Pesawat", url: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/1d067d13988e8754ed6adbebd89b9ee8.png~tplv-obj.webp", points: 5000 },
            { name: "Kuda", url: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/f600a2495ab5d250e7da2066484a9383.png~tplv-obj.webp", points: 42999 },
            { name: "Tiktok Tu", url: "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp", points: 44999 }
        ];

        function normalize(v) {
            let s = String(v || "").trim();
            s = s.replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, "");
            s = s.replace(/^@/, "");
            return s.split(/[/?#]/)[0].trim();
        }

        function pick(obj, keys, fb) {
            for (const k of keys) {
                let v = obj;
                for (const p of k.split(".")) v = v?.[p];
                if (v !== undefined && v !== null && v !== "") return v;
            }
            return fb;
        }

        function extractUser(raw) {
            if (!raw || typeof raw !== "object") throw new Error("Response Kosong");
            if (raw.code !== undefined && Number(raw.code) !== 0) {
                throw new Error(raw.msg || "Akun tidak ditemukan");
            }
            const root = raw.data || raw;
            const info = root.userInfo || root.user_info || {};
            const user = info.user || root.user || info || root;
            const username = String(pick(user, ["uniqueId", "unique_id", "username"], "")).replace(/^@/, "").trim();
            if (!username) throw new Error("Username tidak ditemukan di data");

            return {
                username,
                name: String(pick(user, ["nickname", "name", "display_name"], username)),
                avatar: String(pick(user, ["avatarLarger", "avatarMedium", "avatarThumb", "avatar", "avatar_url"], "")),
                verified: Boolean(pick(user, ["verified", "isVerified", "is_verified"], false))
            };
        }

        async function requestTikwmUser(username) {
            const res = await fetch("https://www.tikwm.com/api/user/info/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                body: "unique_id=" + encodeURIComponent(username)
            });
            if (!res.ok) throw new Error("Gagal koneksi ke server (HTTP " + res.status + ")");
            const json = await res.json();
            return extractUser(json);
        }

        const slotsContainer = document.getElementById('slotsContainer');
        for (let i = 1; i <= 8; i++) {
            slotData[i] = { username: '', name: '', photo: '', topIcon: '', points: 0 };
            pendingData[i] = { username: '', name: '', photo: '' };

            const card = document.createElement('div');
            card.className = 'slot-card';
            
            let optionsHtml = '';
            iconOptions.forEach((opt) => {
                optionsHtml += `<option value="${opt.url}" data-points="${opt.points}">${opt.name} (${opt.points ? opt.points : 0})</option>`;
            });

            card.innerHTML = `
                <h4>Slot ${i}</h4>
                <select id="icon_${i}">${optionsHtml}</select>
                <input type="text" placeholder="Username / Link TikTok..." id="input_${i}">
                <div id="targetCardInline_${i}" class="target-card-inline">
                    <img id="preview_${i}" class="preview-img" alt="Avatar">
                    <div class="target-info-inline">
                        <div id="targetName_${i}" class="target-name-inline">-</div>
                        <div id="targetUsername_${i}" class="target-username-inline">-</div>
                    </div>
                </div>
                <div id="status_${i}" class="status-msg">Siap</div>
                <button class="btn-action" id="btnInstall_${i}" onclick="installSlot(${i})" style="background:#3b82f6; margin-top:8px;">Pasang</button>
                <button class="btn-action" onclick="clearSlot(${i})" style="background:#64748b; margin-top:8px;">Reset</button>
            `;
            slotsContainer.appendChild(card);

            const inputEl = document.getElementById(`input_${i}`);
            let timeout = null;
            inputEl.addEventListener('input', () => {
                const btnInstall = document.getElementById(`btnInstall_${i}`);
                btnInstall.innerText = "Cek...";
                btnInstall.disabled = true;
                clearTimeout(timeout);
                timeout = setTimeout(() => { stageProfile(i); }, 800);
            });
        }

        window.stageProfile = async function(i) {
            const inputEl = document.getElementById(`input_${i}`);
            const statusSpan = document.getElementById(`status_${i}`);
            const previewImg = document.getElementById(`preview_${i}`);
            const targetCardInline = document.getElementById(`targetCardInline_${i}`);
            const nameEl = document.getElementById(`targetName_${i}`);
            const usernameEl = document.getElementById(`targetUsername_${i}`);
            const btnInstall = document.getElementById(`btnInstall_${i}`);

            let inputVal = inputEl.value.trim();
            pendingData[i].inputVal = inputVal;

            if (!inputVal) {
                targetCardInline.classList.remove('show');
                statusSpan.innerText = 'Siap';
                statusSpan.className = 'status-msg';
                pendingData[i].username = '';
                pendingData[i].name = '';
                pendingData[i].photo = '';
                btnInstall.innerText = "Pasang";
                btnInstall.disabled = true;
                return;
            }

            let cleanUsername = normalize(inputVal);
            statusSpan.innerText = 'Mendeteksi...';
            statusSpan.className = 'status-msg loading';
            targetCardInline.classList.add('show');
            
            previewImg.src = `https://ui-avatars.com/api/?name=${cleanUsername}&background=random&size=128`;
            nameEl.innerText = cleanUsername;
            usernameEl.innerText = '@' + cleanUsername;

            try {
                const data = await requestTikwmUser(cleanUsername);
                pendingData[i].username = '@' + data.username;
                pendingData[i].name = data.name;
                pendingData[i].photo = data.avatar;

                previewImg.src = data.avatar;
                nameEl.innerText = data.name;
                usernameEl.innerText = '@' + data.username;
                
                statusSpan.innerText = "Terdeteksi!";
                statusSpan.className = 'status-msg success';
                btnInstall.innerText = "Pasang";
                btnInstall.disabled = false;
            } catch (error) {
                console.error(error);
                statusSpan.innerText = "Gagal / Akun Private";
                statusSpan.className = 'status-msg error';
                btnInstall.innerText = "Gagal";
                btnInstall.disabled = true;
                
                pendingData[i].username = '@' + cleanUsername;
                pendingData[i].name = cleanUsername.charAt(0).toUpperCase() + cleanUsername.slice(1);
                pendingData[i].photo = `https://ui-avatars.com/api/?name=${cleanUsername}&background=random&size=128`;
            }
        }

        window.installSlot = function(i) {
            if(!pendingData[i].username) return;

            const selectEl = document.getElementById(`icon_${i}`);
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            const iconVal = selectEl.value;
            const pointVal = parseInt(selectedOption.getAttribute('data-points')) || 0;

            slotData[i] = { 
                username: pendingData[i].username, 
                name: pendingData[i].name,
                photo: pendingData[i].photo, 
                topIcon: iconVal,
                points: pointVal
            };
            
            channel.postMessage({ type: 'UPDATE_SLOT', slot: i, data: slotData[i] });
            document.getElementById(`status_${i}`).innerText = "Terpasang!";
        }

        window.clearSlot = function(i) {
            document.getElementById(`input_${i}`).value = '';
            document.getElementById(`icon_${i}`).selectedIndex = 0;
            document.getElementById(`targetCardInline_${i}`).classList.remove('show');
            document.getElementById(`status_${i}`).innerText = 'Siap';
            document.getElementById(`status_${i}`).className = 'status-msg';
            document.getElementById(`btnInstall_${i}`).innerText = "Pasang";
            document.getElementById(`btnInstall_${i}`).disabled = true;
            
            slotData[i] = { username: '', name: '', photo: '', topIcon: '', points: 0 };
            pendingData[i] = { username: '', name: '', inputVal: '', photo: '' };
            
            channel.postMessage({ type: 'UPDATE_SLOT', slot: i, data: slotData[i] });
        }

        document.getElementById('hostVideoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) hostVideoUrl = URL.createObjectURL(file);
        });

        function playHostVideo() {
            if (!hostVideoUrl) return alert('Pilih file video host dulu!');
            channel.postMessage({ type: 'UPDATE_HOST_VIDEO', url: hostVideoUrl });
        }

        document.getElementById('giftVideoFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) giftVideoUrl = URL.createObjectURL(file);
        });

        function playGiftVideo() {
            if (!giftVideoUrl) return alert('Pilih file animasi gift dulu!');
            for (let i = 1; i <= 8; i++) {
                const selectEl = document.getElementById(`icon_${i}`);
                const selectedOption = selectEl.options[selectEl.selectedIndex];
                const iconVal = selectEl.value;
                const pointVal = parseInt(selectedOption.getAttribute('data-points')) || 0;

                if (slotData[i]) {
                    slotData[i].topIcon = iconVal;
                    slotData[i].points = pointVal;
                }
            }
            channel.postMessage({ type: 'TRIGGER_GIFT', url: giftVideoUrl, slots: slotData });
        }
    </script>
</body>
</html>
